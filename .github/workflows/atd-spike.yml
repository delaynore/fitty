name: ATD spike
on:
  push:
    branches: [prototype/test-environment-spike]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      max-parallel: 1
      matrix:
        pass: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: avd
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: atd-spike-${{ github.run_id }}-api36-x86_64
      - name: Create clean snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb shell getprop sys.boot_completed
      - name: Boot cached AVD and run offline workout
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash ./gradlew :app:connectedDebugAndroidTest --configuration-cache '-Pandroid.testInstrumentationRunnerArguments.class=com.delaynore.fitty.InProgressWorkoutTest#recordedAndCorrectedSetSurvivesReopeningAndCanBeFinishedOffline'