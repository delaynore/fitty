name: Fast gate spike
on:
  push:
    branches: [prototype/test-environment-spike]
    paths-ignore: ['.github/workflows/atd-spike.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [jvm, assemble, lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        if: matrix.check == 'jvm'
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-4.18.1-api36-linux-x64-v1
      - name: Run full JVM suite
        if: matrix.check == 'jvm'
        run: |
          bash ./gradlew --build-cache :app:testDebugUnitTest --rerun
          du -sh ~/.m2/repository/org/robolectric/android-all-instrumented
      - name: Assemble debug APK
        if: matrix.check == 'assemble'
        run: bash ./gradlew --build-cache :app:assembleDebug
      - name: Run lint
        if: matrix.check == 'lint'
        run: bash ./gradlew --build-cache :app:lintDebug