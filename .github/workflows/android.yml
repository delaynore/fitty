name: Android checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Check Android changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed paths
        id: plan
        run: |
          # The PR merge commit's first parent is the base commit.
          paths=(app gradle build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat .github/actions .github/workflows/android.yml .github/workflows/android-smoke.yml)
          if git diff --quiet HEAD^1 HEAD -- "${paths[@]}"; then
            echo 'No Android code, build, or workflow changes.'
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          else
            diff_status=$?
            if [[ $diff_status -ne 1 ]]; then
              exit "$diff_status"
            fi
          fi
          echo 'required=true' >> "$GITHUB_OUTPUT"

  jvm-tests:
    name: JVM tests
    needs: plan
    if: ${{ !github.event.pull_request.draft && needs.plan.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/android-gradle-check
        with:
          name: JVM tests
          task: ':app:testDebugUnitTest --rerun'
          cache-robolectric: 'true'

  debug-build:
    name: Debug build
    needs: plan
    if: ${{ !github.event.pull_request.draft && needs.plan.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/android-gradle-check
        with:
          name: Debug build
          task: ':app:assembleDebug'

  release-build:
    name: Release build
    needs: plan
    if: ${{ !github.event.pull_request.draft && needs.plan.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/android-gradle-check
        with:
          name: Release build
          task: ':app:assembleRelease'

  android-lint:
    name: Android lint
    needs: plan
    if: ${{ !github.event.pull_request.draft && needs.plan.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/android-gradle-check
        with:
          name: Android lint
          task: ':app:lintDebug -Pkotlin.compiler.execution.strategy=in-process'

  migration-tests:
    name: Room migrations on AOSP ATD
    needs: plan
    if: ${{ !github.event.pull_request.draft && needs.plan.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./gradlew :app:connectedDebugAndroidTest --build-cache --configuration-cache '-Pandroid.testInstrumentationRunnerArguments.annotation=com.delaynore.fitty.MigrationTest'
