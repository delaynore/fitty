@scope (#workout-shell) {
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px 8px 72px; background: var(--background, #232523); color: var(--foreground, #fff); font: 15px system-ui, sans-serif; }

    .phone { color-scheme: dark; --surface: #20261f; --glass: rgb(28 34 26 / .72); --edge: rgb(221 238 206 / .16); --quiet: #b6c0b0; --lime: #c5fa55; display: flex; flex-direction: column; position: relative; width: min(100%, 400px); height: min(690px, 177vw); min-height: 490px; margin: auto; overflow: hidden; border: 1px solid #424940; border-radius: 28px; background: radial-gradient(ellipse at 85% 0%, #263423 0%, transparent 48%), linear-gradient(165deg, #151a14, #0e110e 78%); color: #f2f4ef; box-shadow: 0 18px 48px #0004; }
    .header, .footer { padding: 14px 17px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header { position: relative; border-bottom: 1px solid var(--edge); background: rgb(16 20 15 / .48); backdrop-filter: blur(14px); }
    .footer { border-top: 1px solid var(--edge); }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 17px; }
    h2 { font-size: 30px; line-height: 1.08; letter-spacing: -.045em; }

<p id="storage-warning" role="status" hidden>В этом окне сохранение недоступно. Открой HTML-файл в браузере, чтобы продолжать после закрытия.</p>
<div id="home-shell" class="stage"><main id="phone" class="phone" aria-label="Fitty"></main></div>
<div id="workout-shell" class="stage" hidden><main id="workout" class="phone" data-oled data-back="I" data-design="F" data-set-rows data-add-set data-sequential aria-label="Тренировка"></main></div>
<script>
    const phone = document.querySelector('#phone');
    const variant = 'G';
    const exercise = (name = '', sets = '', reps = '') => ({ name, sets: String(sets), reps: String(reps) });
    const emptyDay = () => ({ name: '', exercises: [exercise()] });
    const sample = [
      { name: 'День A', exercises: [exercise('Жим лёжа', 4, 8), exercise('Тяга гантели'), exercise('Жим гантелей сидя', 3, 10), exercise('Тяга верхнего блока', 3, 12), exercise('Сгибание рук')] },
      { name: 'День B', exercises: [exercise('Приседания', 4, 6), exercise('Румынская тяга', 3, 8), exercise('Подъёмы на носки')] },
      { name: 'День C', exercises: [exercise('Становая тяга', 3, 5), exercise('Жим над головой', 3, 8), exercise('Тяга горизонтального блока', 3, 10)] },
    ];
    const samplePrograms = [
      { name: 'Силовая A/B/C', days: sample },
      { name: 'Всё тело', days: [{ name: 'День A', exercises: [exercise('Приседания', 3, 8), exercise('Жим гантелей', 3, 10), exercise('Тяга гантели', 3, 10)] }] },
    ];
    const tabs = { home: 'Главная', history: 'История' };
    const plural = new Intl.PluralRules('ru');
    const amount = count => `${count} ${{ one: 'упражнение', few: 'упражнения', many: 'упражнений' }[plural.select(count)]}`;
    const dayAmount = count => `${count} ${{ one: 'тренировочный день', few: 'тренировочных дня', many: 'тренировочных дней' }[plural.select(count)]}`;
    const escape = value => value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const storageKey = 'fitty-mvp-prototype-v1';
    let logs = [];
    let editSet = null;
    let tab;
    let programs;
    let selectedProgram;
    let previewProgram;
    let active;
    let chosen;
    let overlay;
    let page;
    let historyIndex;
    let builder;
    let nextDayId = 0;
    let openDay = null;
    let daySwipe = null;
    let suppressSwipeClick = false;
    const dayUndoDuration = 5000;
    const currentDays = () => programs[selectedProgram]?.days ?? [];

    function exerciseList(day) {
      return `<ul class="exercise-list">${day.exercises.map(({ name, sets, reps }) => {
        const plan = sets && reps ? `${sets} × ${reps}` : sets ? `${sets} подх.` : reps ? `${reps} повт.` : '';
        return `<li><span>${escape(name)}</span>${plan ? `<span class="quiet-text">${plan}</span>` : ''}</li>`;
      }).join('')}</ul>`;
    }

    const paths = {
      back: 'M19 12H5m7-7-7 7 7 7', enter: 'm9 5 7 7-7 7',
      library: 'm2.5 8.2 9.5-5 9.5 5-9.5 5z M2.5 12.4l9.5 5 9.5-5 M2.5 16.5l9.5 5 9.5-5',
      plan: 'M5 4h14v16H5z M9 9h6m-6 4h4',
      home: 'm3 10 9-7 9 7v10h-6v-6H9v6H3z',
      history: 'M4 8a9 9 0 1 1-1 7 M4 3v5h5 M12 7v5l3 2',
      settings: 'M3 7h7m5 0h6M3 17h11m5 0h2 M10 4h5v6h-5z M14 14h5v6h-5z',
      check: 'm5 12 4 4L19 6'
    };
    function glyph(name) {
      const path = paths[name];
      return `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${path}"/></svg>`;
    }
    const entryMark = () => `<span class="entry-mark" aria-hidden="true">${glyph('enter')}</span>`;
    function programPick(index) {
      const current = index === selectedProgram;
      const name = escape(programs[index].name);
      const label = current ? `На главной выбрана программа «${name}»` : `Выбрать программу «${name}» для главной`;
      return `<button type="button" class="pick" data-action="use-program" data-index="${index}" aria-label="${label}" title="${label}" aria-pressed="${current}" ${current ? 'disabled' : ''}><span>${glyph('check')}</span></button>`;
    }

    function programBanner() {
      const current = programs[selectedProgram];
      return `<button class="program-banner" type="button" data-action="programs"><span class="program-icon" aria-hidden="true">${glyph('library')}</span><span><strong>Мои программы</strong><small class="quiet-text">${current ? escape(current.name) : 'Добавь первую программу'}</small></span>${entryMark()}</button>`;
    }

    function home() {
      const days = currentDays();
      const title = `<h1>Главная</h1>${programBanner()}`;

      if (!days.length) {
        return '<h1>Главная</h1><section class="panel hero"><h2>Создай программу</h2><p class="quiet-text">Добавь тренировочный день и первое упражнение.</p><button type="button" class="primary wide" data-action="create-program">Создать программу</button><button type="button" class="link wide" data-action="demo">Попробовать на примере</button></section>';
      }
      if (active) {

    function setCount(session) { return session.rows.flat().filter(row => row.values).length; }
    function save() {

          id:++id, values:null, draft:{weight:'',reps:''}

    const dateLabel = stamp => new Date(stamp).toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
function historyScreen(){
  const entries = logs.map((log, index) => `<button class="list-row secondary" type="button" data-action="history-detail" data-index="${index}"><span><strong>${escape(log.day.name)}</strong><small class="quiet-text">${dateLabel(log.date)} · ${escape(log.program)}</small></span>${entryMark()}</button>`);

}

function historyDetail(){
  const log = logs[historyIndex];
  const sections = log.day.exercises.map((ex, i) => {
    const rows = log.rows[i].map((row, j) => `<button type="button" class="list-row secondary" data-action="history-set" data-index="${i}" data-item="${j}"><span>Подход ${j+1}</span><strong>${row.values[0].toLocaleString('ru-RU')} кг × ${row.values[1]}</strong></button>`).join('');
    return `<section class="panel log-exercise"><h2>${escape(ex.name)}</h2><div class="list">${rows || '<p class="quiet-text">Без записанных подходов</p>'}</div></section>`;
  });
  return `<h1>${escape(log.day.name)}</h1><p class="quiet-text log-meta">${dateLabel(log.date)} · ${escape(log.program)}</p>${sections.join('')}<button class="danger wide" type="button" data-action="history-remove">Удалить тренировку</button>`;
}

function historyOverlay(){
  const log = logs[historyIndex];
  const deleting = overlay === 'history-remove';
  const ex = editSet && log.day.exercises[editSet.i];
  const values = editSet && log.rows[editSet.i][editSet.j]?.values;
  const last = setCount(log) === 1;
  const title = deleting ? 'Удалить тренировку?' : `Подход ${editSet.j + 1}`;
  const content = deleting ? `<p class="quiet-text">${escape(log.day.name)} · ${dateLabel(log.date)}. Все записанные подходы будут удалены из истории.</p><button type="button" class="danger wide" data-action="confirm-remove">Удалить тренировку</button>` :
    `<p class="quiet-text">${escape(ex.name)}</p><form id="history-form" class="editor-form" novalidate><label>Вес, кг<input name="weight" inputmode="decimal" value="${String(values[0]).replace('.',',')}"></label><label>Повторения<input name="reps" inputmode="numeric" value="${values[1]}"></label><p class="editor-error" role="alert" hidden></p><button class="primary" type="submit">Сохранить</button></form>
    ${last ? '<p class="quiet-text">Это последний подход. Чтобы убрать его из истории, удали тренировку целиком.</p><button class="danger wide" data-action="history-remove">Удалить тренировку целиком</button>' : '<button class="danger wide" data-action="remove-history-set">Удалить подход</button>'}`;
  return `<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-head"><h2>${title}</h2><button type="button" class="link" data-action="close" aria-label="Закрыть">×</button></div>${content}</section></div>`;
}    function programsScreen() {
      const rows = programs.map(({ name, days }, index) => {
        const current = index === selectedProgram;
        const programName = escape(name);
        const summary = `<strong>${programName}</strong><small class="quiet-text">${dayAmount(days.length)}</small>`;
          return `<div class="program-row" ${current ? 'data-current' : ''}><button class="program-detail" type="button" data-action="program-detail" data-index="${index}" aria-label="Открыть программу «${programName}»"><span class="file-mark">${glyph('plan')}</span><span>${summary}</span>${entryMark()}</button>${programPick(index)}</div>`;
      }).join('');
      return `<h1>Мои программы</h1>${rows ? `<div class="list program-list">${rows}</div>` : '<p class="quiet-text program-list">У тебя пока нет программ.</p>'}<button type="button" class="secondary wide" data-action="create-program">＋ Новая программа</button>`;
    }

    function programDetail() {
      const { name, days } = programs[previewProgram];
      const heading = `<div class="detail-title"><h1>${escape(name)}</h1>${programPick(previewProgram)}</div>`;
      return `${heading}<div class="list program-days">${days.map(day => `<section class="panel"><h2>${escape(day.name)}</h2>${exerciseList(day)}</section>`).join('')}</div>
        <div class="program-actions"><button type="button" class="secondary wide edit-action" data-action="edit-program">Редактировать программу ${entryMark()}</button></div>`;
    }

    function beginBuilder(programIndex) {
      const source = programIndex === undefined ? { name: '', days: [emptyDay()] } : structuredClone(programs[programIndex]);
      const days = source.days.map(day => ({ ...day, id: ++nextDayId }));
      builder = { name: source.name, days, removed: [], programIndex, returnPage: page, dayIndex: 0, dayOpen: false, error: null };
      openDay = null;

    }

    function builderField(label, field, value, { day, item, placeholder, numeric } = {}) {
      const error = builder.error;

      return `<label><span class="quiet-text field-name">${label}</span><input name="${field}" value="${escape(value)}" ${day === undefined ? '' : `data-day="${day}"`} ${item === undefined ? '' : `data-item="${item}"`} ${placeholder ? `placeholder="${placeholder}"` : ''} ${numeric ? 'inputmode="numeric"' : ''} ${invalid ? 'aria-invalid="true"' : ''} autocomplete="off"></label>`;
    }

    function dayFields(index, detail = false) {
      const day = builder.days[index];

        <details class="recommendation" ${sets || reps || (builder.error?.day === index && builder.error?.item === item && ['sets', 'reps'].includes(builder.error.field)) ? 'open' : ''}><summary class="quiet-text">Рекомендации</summary>
          <div class="recommendation-fields">${builderField('Подходы', 'sets', sets, { day: index, item, numeric: true })}${builderField('Повторения', 'reps', reps, { day: index, item, numeric: true })}</div></details></div>`).join('');
      return `<section class="builder-day-fields${detail ? ' day-detail' : ''}">
        ${builderField('Название тренировочного дня', 'day', day.name, { day: index, placeholder: 'День A' })}
        <h2>Упражнения</h2>${rows}<button class="secondary wide" type="button" data-action="add-exercise" data-index="${index}">＋ Добавить упражнение</button>
        ${detail ? '' : `<button class="link remove-day" type="button" data-action="remove-day" data-index="${index}">Убрать день из программы</button>`}</section>`;

    function editingDay() {
      return variant === 'G' && builder.dayOpen;
    }

    function programEditor() {
      const error = builder.error ? `<p class="editor-error" role="alert">${builder.error.message}</p>` : '';
      if (editingDay()) {
        const day = builder.days[builder.dayIndex];
        return `<h1>${escape(day.name.trim()) || `День ${builder.dayIndex + 1}`}</h1><form class="editor-form" id="program-form" novalidate>${error}${dayFields(builder.dayIndex, true)}</form>`;
      }
      const days = builder.days.map((day, index) => {
        const expanded = variant !== 'G' && index === builder.dayIndex;
        const count = day.exercises.filter(item => item.name.trim()).length;
        const title = escape(day.name.trim()) || `День ${index + 1}`;
        const card = `<div class="builder-day"><button class="list-row" type="button" data-action="edit-day" data-index="${index}" ${variant === 'G' ? '' : `aria-expanded="${expanded}"`}>
          <span><strong>${title}</strong><small class="quiet-text">${count ? amount(count) : 'Упражнений пока нет'}</small></span>${expanded ? '<span aria-hidden="true">−</span>' : entryMark()}</button>${expanded ? dayFields(index) : ''}</div>`;
        if (variant !== 'G') return card;
        const open = openDay === day.id;
        return `<div class="builder-swipe" data-day-id="${day.id}" ${open ? 'style="--day-offset:60px"' : ''}>
          <button class="day-trash" type="button" data-action="remove-day" data-index="${index}" aria-label="Убрать день ${title}" ${open ? '' : 'tabindex="-1" aria-hidden="true"'}><span class="trash-icon" aria-hidden="true"></span></button>${card}</div>`;
      }).join('');
      return `<h1>${builder.programIndex === undefined ? 'Новая программа' : 'Редактировать программу'}</h1><form class="editor-form" id="program-form" novalidate>${error}
        ${builderField('Название программы', 'program', builder.name, { placeholder: 'Силовая A/B/C' })}
        <div class="builder-section"><h2>Тренировочные дни</h2>${days}<button class="secondary wide" type="button" data-action="builder-add-day">＋ Добавить тренировочный день</button></div></form>`;
    }

    function dayError(day, index) {
      if (!day.name.trim()) return { field: 'day', day: index, message: 'Введи название тренировочного дня.' };
      if (!day.exercises.length) return { day: index, message: 'Добавь хотя бы одно упражнение.' };
      for (const [item, { name, sets, reps }] of day.exercises.entries()) {
        if (!name.trim()) return { field: 'exercise', day: index, item, message: 'Введи название упражнения или убери пустую строку.' };
        for (const [field, value] of [['sets', sets], ['reps', reps]]) {
          if (value.trim() && (!/^\d+$/.test(value.trim()) || !Number.isSafeInteger(Number(value)) || Number(value) < 1)) {
            return { field, day: index, item, message: 'Укажи целое число от 1 или оставь поле пустым.' };
          }
        }
      }
      return null;
    }

    function showBuilderError(error) {

      }
      render();
      phone.querySelector('[aria-invalid="true"]')?.focus();
    }

    function removeDay(index) {
      const [day] = builder.days.splice(index, 1);
      builder.removed.unshift({ day, title: day.name.trim() || `День ${index + 1}`, expiresAt: performance.now() + dayUndoDuration });
      builder.dayIndex = Math.min(index, builder.days.length - 1);
      builder.dayOpen = false;
      builder.error = null;
    }

    function undoDay(id) {
      const removal = builder.removed.find(entry => entry.day.id === id);
      if (!removal || removal.expiresAt <= performance.now()) return;
      const current = builder.days[builder.dayIndex];
      const next = builder.days.findIndex(day => day.id > id);
      builder.days.splice(next < 0 ? builder.days.length : next, 0, removal.day);
      builder.dayIndex = current ? builder.days.indexOf(current) : 0;
      builder.removed = builder.removed.filter(entry => entry !== removal);
      builder.error = null;
    }

    function renderDayUndo() {
      const now = performance.now();
      const cards = builder.removed.filter(entry => entry.expiresAt > now).map(({ day, title }) =>
        `<div class="day-undo" data-removed-day="${day.id}"><span role="status">Убран день «${escape(title)}»</span><button type="button" class="link" data-action="undo-day" data-index="${day.id}"><span class="quiet-text undo-time" aria-hidden="true"></span>Вернуть</button></div>`);
      return cards.length ? `<div class="day-undo-stack" ${overlay ? 'inert' : ''}>${cards.join('')}</div>` : '';

    function updateDayUndo() {
      if (!builder?.removed.length) return;

      if (!stack) return;
      for (const card of Array.from(stack.children)) {
        const removal = builder.removed.find(entry => entry.day.id === Number(card.dataset.removedDay));
        if (!removal) { card.remove(); continue; }
        const remaining = removal.expiresAt - now;
        const time = card.querySelector('.undo-time');
        const label = `${Math.ceil(remaining / 1000)} с`;

      if (!stack.children.length) stack.remove();
    }

    function detail() {

    function renderOverlay() {

      return `<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-head"><h2>${title}</h2><button type="button" class="link" data-action="close" aria-label="Закрыть">×</button></div>${body}</section></div>`;
    }

    phone.addEventListener('click', event => {

      openDay = null;
      switch (action) {

    phone.addEventListener('input', event => {

      const { day, item } = input.dataset;
      if (name === 'program') builder.name = value;
      else if (name === 'day') builder.days[Number(day)].name = value;
      else builder.days[Number(day)].exercises[Number(item)][name === 'exercise' ? 'name' : name] = value;
      input.removeAttribute('aria-invalid');
    });

    phone.addEventListener('submit', event => {
      event.preventDefault();
      if (event.target.id === 'history-form') {
        const form = event.target;
        const value = parseSet(form);
        if (!value) return;
        logs[historyIndex].rows[editSet.i][editSet.j].values = value;
        overlay = editSet = null; render(); return;
      }
      if (editingDay()) {
        const error = dayError(builder.days[builder.dayIndex], builder.dayIndex);
        if (error) { showBuilderError(error); return; }
        builder.dayOpen = false;
        builder.error = null;
        render();
        return;
      }
      const name = builder.name.trim();
      if (!name) { showBuilderError({ field: 'program', message: 'Введи название программы.' }); return; }
      if (!builder.days.length) { showBuilderError({ message: 'Добавь хотя бы один тренировочный день.' }); return; }
      for (const [index, day] of builder.days.entries()) {
        const error = dayError(day, index);
        if (error) { showBuilderError(error); return; }
      }
      const days = builder.days.map(day => ({ name: day.name.trim(), exercises: day.exercises.map(item => exercise(item.name.trim(), item.sets.trim(), item.reps.trim())) }));
      if (builder.programIndex === undefined) {
        programs.push({ name, days });
        if (selectedProgram === null) {
          selectedProgram = 0;
          chosen = 0;
          page = null;
          tab = 'home';
        } else page = 'programs';
      } else {
        programs[builder.programIndex] = { name, days };
        if (builder.programIndex === selectedProgram) chosen = Math.min(chosen, days.length - 1);
        page = 'program-detail';
      }
      builder = null;
      render();
    });

    phone.addEventListener('pointerdown', event => {
      suppressSwipeClick = false;
      const item = event.target.closest('.builder-swipe');
      if (!item || event.button !== 0 || event.target.closest('.day-trash')) return;
      daySwipe = { item, id: Number(item.dataset.dayId), pointer: event.pointerId, x: event.clientX, y: event.clientY, dragging: false, delta: 0 };
    });

    phone.addEventListener('pointermove', event => {
      const gesture = daySwipe;
      if (!gesture || gesture.pointer !== event.pointerId) return;
      const delta = event.clientX - gesture.x;
      if (!gesture.dragging) {
        const vertical = Math.abs(event.clientY - gesture.y);
        if (vertical > 12 && vertical > Math.abs(delta)) { daySwipe = null; return; }
        if (Math.abs(delta) < 12 || (delta < 0 && openDay !== gesture.id)) return;
        gesture.dragging = true;
        gesture.item.setPointerCapture(event.pointerId);
      }
      gesture.delta = delta;
      const offset = openDay === gesture.id ? 60 : 0;
      gesture.item.style.setProperty('--day-offset', `${Math.max(0, Math.min(84, offset + delta))}px`);
    });

    phone.addEventListener('pointerup', event => {
      const gesture = daySwipe;
      if (!gesture || gesture.pointer !== event.pointerId) return;
      daySwipe = null;
      if (!gesture.dragging) return;
      suppressSwipeClick = true;
      if (gesture.delta >= 40) openDay = gesture.id;
      else if (gesture.delta < -24) openDay = null;
      render({ keepScroll: true });
    });

    phone.addEventListener('pointercancel', event => {
      const gesture = daySwipe;
      if (!gesture || gesture.pointer !== event.pointerId) return;
      gesture.item.style.setProperty('--day-offset', openDay === gesture.id ? '60px' : '0px');
      daySwipe = null;
    });

    phone.addEventListener('keydown', event => {
      const row = event.target.closest('.builder-swipe');
      if (!row || event.key !== 'ArrowRight') return;
      event.preventDefault();
      event.stopPropagation();
      openDay = Number(row.dataset.dayId);
      render({ keepScroll: true });
      phone.querySelector(`.builder-swipe[data-day-id="${openDay}"] .day-trash`).focus();
    });


    function showWorkout() {
      document.querySelector('#home-shell').hidden = true;
      document.querySelector('#workout-shell').hidden = false;
      workout.open(active);
    }
    function leaveWorkout(finished) {
      if(finished) {
        const rows = active.rows.map(list => list.filter(row => row.values).map(({values}) => ({values})));
        logs.unshift({program:active.program, day:active.day, date:Date.now(), rows});
        active = null; historyIndex = 0; tab = 'history'; page = 'history';
      } else { tab = 'home'; page = null; }
      document.querySelector('#home-shell').hidden = false;
      document.querySelector('#workout-shell').hidden = true;
      render();
    }
    function parseSet(form) {
      const weight = form.elements.weight.value.trim().replace(',', '.');
      const reps = form.elements.reps.value.trim();
      const invalidWeight = !/^\d+(\.\d{1,4})?$/.test(weight) || !Number.isFinite(Number(weight));
      const invalidReps = !/^\d+$/.test(reps) || !Number.isSafeInteger(Number(reps)) || Number(reps)<1;
      if(!invalidWeight && !invalidReps) return [Number(weight),Number(reps)];
      const error = form.querySelector('[role="alert"]');
      error.textContent = invalidWeight ? 'Введи вес в килограммах, например 62,5.' : 'Введи целое число повторений от 1.';
      error.hidden = false; form.elements[invalidWeight ? 'weight' : 'reps'].focus();
      return null;
    }
    document.addEventListener('keydown', event => {
      if(event.key === 'Escape' && overlay) { overlay=null; render(); }
    });
    restore(); render(); setInterval(updateDayUndo,100);

const workout = (() => {
    const phone = document.querySelector('#workout');
    const variant = 'U', sequentialSets = true;
    let exercises = [], swipeRows = [], selected = 0, deadline = 0, nextRowId = 0;
    let openSwipe = null, recentlySaved = null, swipeGesture = null, suppressSwipeClick = false, sheet = null, removedRows = [];
    const count = () => exercises.reduce((n,ex)=>n+ex.sets.length,0);
    const number = value => value.toLocaleString('ru-RU',{maximumFractionDigits:4,useGrouping:false});
    const timerVariant = () => 'B', compareLayouts = false;
    function controlIcon(name) {
      const paths = { back:'M19 12H5m7-7-7 7 7 7', next:'M5 12h14m-7-7 7 7-7 7', timer:'M10 2h4m-2 0v3m6 1 2-2 M12 6a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 4v4l3 2' };
      return `<svg class="control-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="${paths[name]}"/></svg>`;
    }
    const newSwipeRow = values => ({ id: ++nextRowId, values: values ?? null, draft: { weight: '', reps: '' } });
    const undoDuration = 5000;
    const repetitionPlural = new Intl.PluralRules('ru');
    const validWeight = value => /^\d+(\.\d{1,4})?$/.test(value) && Number.isFinite(Number(value));
    const validReps = value => /^\d+$/.test(value) && Number.isSafeInteger(Number(value)) && Number(value) > 0;
    const nextUnrecordedRow = exercise => swipeRows[exercise].find(row => !row.values);

    function syncSwipeSets(exercise) {
      exercises[exercise].sets = swipeRows[exercise].flatMap(row => row.values ? [row.values] : []);
    }

    function removeSwipeRow(id) {
      const rows = swipeRows[selected];
      const index = rows.findIndex(row => row.id === id);
      if (index < 0) return;
      const [row] = rows.splice(index, 1);
      removedRows.unshift({ row, exercise: selected, position: index + 1, expiresAt: Date.now() + undoDuration });
      openSwipe = null;
      syncSwipeSets(selected);
    }

    function undoRemoval(id) {
      const removal = removedRows.find(({ row }) => row.id === id);
      if (!removal || removal.expiresAt <= Date.now()) return;
      const { row, exercise } = removal;
      const rows = swipeRows[exercise];
      const after = rows.findIndex(item => item.id > id);
      rows.splice(after < 0 ? rows.length : after, 0, row);
      removedRows = removedRows.filter(entry => entry !== removal);
      syncSwipeSets(exercise);
    }

    function renderSwipeLog() {
      let savedIndex = 0;
      const next = nextUnrecordedRow(selected);
      const rows = swipeRows[selected].map(({ id, values }, index) => {
        const position = index + 1;
        const label = `<span class="sub set-index">${position}</span>`;
        const open = openSwipe === id;
        const highlight = recentlySaved?.id === id && performance.now() - recentlySaved.at < 450;
        const isNext = sequentialSets && next?.id === id;
        const locked = sequentialSets && !isNext ? 'disabled' : '';
        const controls = values
          ? `<button type="button" class="set${highlight ? ' recent-save' : ''}" data-action="edit" data-exercise="${selected}" data-set="${savedIndex++}" data-position="${position}" aria-label="Изменить подход ${position}, ${number(values[0])} кг, повторения: ${values[1]}">${label}<strong>${number(values[0])}</strong><strong>${values[1]}</strong><span class="check" aria-hidden="true">✓</span></button>`
          : `<form class="entry set-draft" data-exercise="${selected}" data-set="" data-row="${id}" ${isNext ? 'data-next' : ''} novalidate>${label}
            <input name="weight" type="text" inputmode="decimal" autocomplete="off" placeholder="${isNext ? 'Вес' : locked ? '—' : ''}" aria-label="Вес, кг, подход ${position}" ${locked}>
            <input name="reps" type="text" inputmode="numeric" autocomplete="off" placeholder="${isNext ? 'Повторы' : locked ? '—' : ''}" aria-label="Повторения, подход ${position}" ${locked}>
            <button class="primary draft-save" type="submit" aria-label="Записать подход ${position}" ${locked}>✓</button><p class="error" role="alert" hidden></p></form>`;
        return `<div class="swipe-item" data-row="${id}" tabindex="0" aria-label="Подход ${position}" ${open ? 'style="--drag:60px"' : ''}>
          <button type="button" class="swipe-trash" data-action="trash" data-row="${id}" aria-label="Удалить подход ${position}" ${open ? '' : 'tabindex="-1" aria-hidden="true"'}><span class="trash-icon" aria-hidden="true"></span></button>${controls}</div>`;
      });
      const columns = '<div class="columns sub"><span>№</span><span>Вес, кг</span><span>Повторения</span><span></span></div>';
      const blockAdd = sequentialSets && next;
      return `<div class="sets">${rows.length ? columns + rows.join('') : ''}</div><button class="add-set" type="button" data-action="add-row" ${blockAdd ? 'disabled title="Сначала запиши подходы из списка"' : ''}><span aria-hidden="true">+</span>${rows.length ? 'Ещё подход' : 'Добавить подход'}</button>`;
    }

    function renderUndo() {
      const now = Date.now();
      const cards = removedRows.filter(entry => entry.expiresAt > now).map(({ row, exercise, position }) => {
        const draftWeight = row.draft.weight.trim().replace(',', '.');
        const draftReps = row.draft.reps.trim();
        const [weight, reps] = row.values ?? [validWeight(draftWeight) ? Number(draftWeight) : null, validReps(draftReps) ? Number(draftReps) : null];
        const parts = [];
        if (weight !== null) parts.push(`${number(weight)} кг`);
        if (reps !== null) {
          const word = { one: 'повторение', few: 'повторения', many: 'повторений' }[repetitionPlural.select(reps)];
          parts.push(`${reps} ${word}`);
        }
        if (!row.values) parts.push(row.draft.weight || row.draft.reps ? 'Черновик' : 'Пустая строка');
        const detail = parts.join(' · ');
        return `<div class="undo-entry" data-removed="${row.id}">
          <div class="undo-summary" role="status"><strong>Удалён подход ${position}</strong><span class="sub">${exercises[exercise].name} · ${detail}</span></div>
          <div class="undo-actions"><span class="sub undo-seconds" aria-hidden="true"></span><button class="quiet" type="button" data-action="undo-row" data-row="${row.id}" aria-label="Вернуть подход ${position}, ${exercises[exercise].name}">Вернуть</button></div>
          <div class="undo-progress" aria-hidden="true"></div></div>`;
      });
      return cards.length ? `<div class="undo-stack" aria-label="Удалённые подходы" ${sheet ? 'inert' : ''}>${cards.join('')}</div>` : '';
    }

    function updateUndo() {
      if (!removedRows.length) return;
      const now = Date.now();
      removedRows = removedRows.filter(entry => entry.expiresAt > now);
      const stack = phone.querySelector('.undo-stack');
      if (!stack) return;
      for (const card of Array.from(stack.children)) {
        const entry = removedRows.find(({ row }) => row.id === Number(card.dataset.removed));
        if (!entry) { card.remove(); continue; }
        const remaining = entry.expiresAt - now;
        const label = card.querySelector('.undo-seconds');
        const seconds = `${Math.ceil(remaining / 1000)} с`;
        if (label.textContent !== seconds) label.textContent = seconds;
        card.style.setProperty('--remaining', remaining / undoDuration);
      }
      if (!stack.children.length) stack.remove();
    }

function open(session) {
  selected=session.selected; deadline=session.deadline; nextRowId=session.nextId;
  swipeRows=session.rows; removedRows=session.removed;
  exercises=session.day.exercises.map(ex => ({
    name:escape(ex.name), plan:ex.sets && ex.reps ? `${ex.sets} × ${ex.reps}` : ex.sets ? `${ex.sets} подх.` : ex.reps ? `${ex.reps} повт.` : '', sets:[]
  }));
  exercises.forEach((_,i)=>syncSwipeSets(i));
  openSwipe=sheet=recentlySaved=swipeGesture=null;
  render();
}

function persist() {
  Object.assign(active,{selected,deadline,nextId:nextRowId,removed:removedRows});
  save();
}

function renderSheet() {
  if (!sheet) return '';
  let title, body;
  if(sheet.mode === 'choose') {
    title='Все упражнения';
    body=renderQueue(true);
  } else if (sheet.mode === 'edit') {
    const {exercise,set,position}=sheet;
    const [weight,reps]=exercises[exercise].sets[set];
    title=`Подход ${position} · ${exercises[exercise].name}`;
    body=`<form class="entry" data-exercise="${exercise}" data-set="${set}" novalidate><label>Вес, кг<input name="weight" inputmode="decimal" value="${number(weight)}"></label><label>Повторения<input name="reps" inputmode="numeric" value="${reps}"></label><button class="primary" type="submit">Сохранить</button><p role="alert" class="error" hidden></p></form>`;
  } else {
    title='Завершить тренировку?';
    body=`<p class="sub">${escape(active.day.name)} · Записано подходов: ${count()}</p><button type="button" class="primary wide" data-action="confirm">Завершить и сохранить</button>`;
  }
  return `<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="between"><h2>${title}</h2><button type="button" class="quiet" aria-label="Закрыть" data-action="close">×</button></div>${body}</section></div>`;
}
    function renderExerciseIntro(timer) {
      const { name, plan } = exercises[selected];
      const back = `<button class="back-control" type="button" data-action="home" aria-label="На главный экран">${controlIcon('back')}</button>`;
      const position = `<strong>${selected + 1}</strong> из ${exercises.length}`;
      return `<div class="exercise-intro" ${sheet ? 'inert' : ''}>
        <div class="intro-kicker">${back}<span class="sub exercise-position">Упражнение ${position}</span></div>
        <div class="intro-title"><h2>${name}</h2></div>${timer}${plan ? `<p class="sub exercise-plan">Рекомендация · ${plan}</p>` : ''}
      </div>`;
    }

    function renderShortcuts() {
      const rightAction = selected === exercises.length - 1
        ? `<button type="button" class="finish-action shortcut-finish" data-action="finish" aria-label="Завершить тренировку" ${count() ? '' : 'disabled'}>Завершить</button>`
        : `<button type="button" class="shortcut" data-action="next-exercise" aria-label="Следующее упражнение">${controlIcon('next')}</button>`;
      return `<nav class="shortcuts" aria-label="Управление тренировкой" ${sheet ? 'inert' : ''}>
        <button type="button" class="shortcut" data-action="previous-exercise" aria-label="Предыдущее упражнение" ${selected === 0 ? 'disabled' : ''}>${controlIcon('back')}</button>
        <button type="button" class="shortcut-picker" data-action="choose" aria-haspopup="dialog">Все упражнения</button>
        ${rightAction}
      </nav>`;
    }

    function renderQueue(picker = false) {
      return `<div class="queue">${exercises.map(({ name, plan, sets }, index) => {
        const detail = picker ? sets.map(([weight, reps]) => `${number(weight)} кг × ${reps}`).join(' · ') : plan;
        return `<button type="button" class="queue-row" data-action="${picker ? 'select' : 'open'}" data-exercise="${index}" ${picker ? `aria-current="${index === selected}"` : ''}><span class="sub">${index + 1}</span><span>${name}${detail ? `<small class="sub">${detail}</small>` : ''}</span><strong>${sets.length}<span class="sub">${picker ? ' подх.' : ' ›'}</span></strong></button>`;
      }).join('')}</div>`;
    }

    function updateTimer() {
      const milliseconds = Math.max(0, deadline - Date.now());
      const remaining = Math.ceil(milliseconds / 1000);
      const clock = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, '0')}`;
      if (compareLayouts) {
        const button = phone.querySelector('.timer');
        if (!button) return;
        button.classList.toggle('running', remaining > 0);
        button.textContent = remaining ? `${clock} · Сбросить` : 'Отдых 2:00';
        return;
      }
      const slot = phone.querySelector('.rest-slot');
      if (!slot) return;
      const start = phone.querySelector('.rest-start');
      const stop = slot.querySelector('.rest-stop');
      const readout = slot.querySelector('.rest-readout');
      const progress = slot.querySelector('.rest-progress');
      start.hidden = remaining > 0;
      if (timerVariant() === 'C') slot.hidden = !remaining;
      stop.hidden = !remaining;
      readout.hidden = !remaining;
      if (readout.textContent !== clock) readout.textContent = clock;
      if (progress) {
        progress.hidden = !remaining;
        progress.style.setProperty('--remaining', `${100 * milliseconds / 120000}%`);
      }
    }

    function renderTimer() {
      if (compareLayouts) return { header: '<button type="button" class="timer" data-action="timer"></button>' };
      const start = `<button type="button" class="quiet rest-start" data-action="timer" aria-label="Запустить таймер отдыха на 2 минуты" title="Отдых 2:00">${controlIcon('timer')}</button>`;
      const clock = '<span class="rest-readout" role="timer" aria-label="Осталось на отдых"></span><button type="button" class="quiet rest-stop" data-action="timer" aria-label="Сбросить таймер" title="Сбросить таймер"></button>';
      const placement = timerVariant();
      if (placement !== 'C') {
        const progress = placement === 'B' ? '<div class="rest-progress" aria-hidden="true" hidden><span></span></div>' : '';
        return { header: `<div class="rest-slot timer-${placement.toLowerCase()}">${start}${clock}${progress}</div>` };
      }
      const panel = `<div class="rest-slot timer-c" ${sheet ? 'inert' : ''} hidden><span class="rest-caption sub">Отдых</span>${clock}</div>`;
      return { header: start, bottom: panel };
    }

function render({keepScroll=false}={}) {
  const scroll= keepScroll ? phone.querySelector('.content')?.scrollTop : 0;
  phone.innerHTML = renderExerciseIntro(renderTimer().header)+`<div class="content" ${sheet ? 'inert' : ''}>${renderSwipeLog()}</div>`+renderUndo()+renderShortcuts()+renderSheet();
  phone.querySelector('.content').scrollTop = scroll || 0;
  for(const form of phone.querySelectorAll('.set-draft')){
    const row=swipeRows[selected].find(row=>row.id===Number(form.dataset.row));
    form.elements.weight.value=row.draft.weight; form.elements.reps.value=row.draft.reps;
  }
  updateTimer(); updateUndo(); persist();
}
    function revealInWorkout(control) {
      const content = phone.querySelector('.content');
      const overflow = control.getBoundingClientRect().bottom - content.getBoundingClientRect().bottom;
      if (overflow > 0) content.scrollTop += overflow;
    }

    phone.addEventListener('click', event => {
      if (suppressSwipeClick && event.detail !== 0) {
        suppressSwipeClick = false;
        event.preventDefault();
        return;
      }
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const { action, exercise, set, position, row } = button.dataset;
      if (action !== 'timer') openSwipe = null;
      switch (action) {
        case 'timer':
          deadline = deadline > Date.now() ? 0 : Date.now() + 120000;
          updateTimer();
          persist();
          if (event.detail === 0) phone.querySelector(deadline ? '.rest-stop' : '.rest-start').focus();
          return;
        case 'select': selected = Number(exercise); sheet = null; break;
        case 'choose': sheet = { mode: 'choose' }; break;
        case 'next-exercise': selected += 1; break;
        case 'previous-exercise': selected -= 1; break;
        case 'add-row':
          if (sequentialSets && nextUnrecordedRow(selected)) return;
          swipeRows[selected].push(newSwipeRow());
          break;
        case 'trash': removeSwipeRow(Number(row)); break;
        case 'undo-row': undoRemoval(Number(row)); break;
        case 'edit': sheet = { mode: 'edit', exercise: Number(exercise), set: Number(set), position: position ? Number(position) : undefined }; break;
        case 'finish': sheet = { mode: 'finish' }; break;
        case 'close': sheet=null; break;
        case 'confirm': if(count()) leaveWorkout(true); return;
        case 'home': persist(); leaveWorkout(false); return;
      }
      render({keepScroll:!['select','next-exercise','previous-exercise'].includes(action)});
      if(action==='add-row') phone.querySelector('.set-draft[data-next] input')?.focus();
      if(sheet) phone.querySelector('.sheet button')?.focus();
    });
    phone.addEventListener('input', event=>{
      const form=event.target.closest('.set-draft');
      if(!form) return;
      const row=swipeRows[selected].find(row=>row.id===Number(form.dataset.row));
      row.draft[event.target.name]=event.target.value;
      persist();
    });
    phone.addEventListener('submit', event=>{
      event.preventDefault();
      const form=event.target, exercise=Number(form.dataset.exercise);
      const {set,row}=form.dataset;
      const target=set==='' ? nextUnrecordedRow(exercise) : swipeRows[exercise].filter(r=>r.values)[Number(set)];
      if(!target || (set==='' && target.id!==Number(row))) return;
      const value=parseSet(form);
      if(!value) return;
      target.values=value; syncSwipeSets(exercise); openSwipe=null;
      if(set==='') recentlySaved={id:target.id,at:performance.now()}; else sheet=null;
      render({keepScroll:true});
      if(set===''){
        const next=phone.querySelector('.set-draft[data-next],.add-set');
        revealInWorkout(next); (next.querySelector('input') ?? next).focus({preventScroll:true});
      }
    });
      phone.addEventListener('pointerdown', event => {
        suppressSwipeClick = false;
        const item = event.target.closest('.swipe-item');
        if (!item || event.button !== 0 || event.target.closest('.swipe-trash')) return;
        swipeGesture = { id: Number(item.dataset.row), item, pointer: event.pointerId, x: event.clientX, y: event.clientY, delta: 0, dragging: false };
      });

      phone.addEventListener('pointermove', event => {
        const gesture = swipeGesture;
        if (!gesture || gesture.pointer !== event.pointerId) return;
        const delta = event.clientX - gesture.x;
        if (!gesture.dragging) {
          const vertical = Math.abs(event.clientY - gesture.y);
          if (vertical > 12 && vertical > Math.abs(delta)) { swipeGesture = null; return; }
          if (Math.abs(delta) < 12 || (delta < 0 && openSwipe !== gesture.id)) return;
          gesture.dragging = true;
          gesture.item.setPointerCapture(event.pointerId);
        }
        gesture.delta = delta;
        const offset = openSwipe === gesture.id ? 60 : 0;
        const position = Math.max(0, Math.min(gesture.item.clientWidth * .68, offset + delta));
        gesture.item.style.setProperty('--drag', `${position}px`);
      });

      phone.addEventListener('pointerup', event => {
        const gesture = swipeGesture;
        if (!gesture || gesture.pointer !== event.pointerId) return;
        swipeGesture = null;
        if (!gesture.dragging) return;
        suppressSwipeClick = true;
        const fullSwipe = Math.min(145, gesture.item.clientWidth * .48);
        if (variant === 'V' && gesture.delta >= fullSwipe) removeSwipeRow(gesture.id);
        else if (gesture.delta >= 40) openSwipe = gesture.id;
        else if (gesture.delta < -24) openSwipe = null;
        render({ keepScroll: true });
      });

      phone.addEventListener('pointercancel', event => {
        const gesture = swipeGesture;
        if (!gesture || gesture.pointer !== event.pointerId) return;
        gesture.item.style.setProperty('--drag', openSwipe === gesture.id ? '60px' : '0px');
        swipeGesture = null;
      });

      phone.addEventListener('keydown', event => {
        const item = event.target.closest('.swipe-item');
        if (!item || event.target.matches('input')) return;
        if (event.key === 'ArrowRight') {
          event.preventDefault();
          event.stopPropagation();
          openSwipe = Number(item.dataset.row);
          render({ keepScroll: true });
          phone.querySelector(`.swipe-item[data-row="${openSwipe}"] .swipe-trash`).focus();
        }
      });
    
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape' && !document.querySelector('#workout-shell').hidden && sheet) { sheet=null; render({keepScroll:true}); }
    });
    setInterval(()=>{if(!document.querySelector('#workout-shell').hidden){updateTimer();updateUndo();}},100);
    return {open};
  })();
</script></body></html>
