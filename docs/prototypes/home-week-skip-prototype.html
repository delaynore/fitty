<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitty — Прототип: выбор варианта недели и пропуск дня на Главной (A / B / C)</title>
<!-- Three structurally different UI variants (A: Dedicated Week Bar + Bottom Sheet Skip, B: Program-Embedded Pill + Chip Menu + Inline Confirm, C: Pass-Centric Vertical Checklist Accordion) for training week variant selection and explicit day skipping on Home, switchable via ?variant= and the floating bottom bar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f2;
    color: #171717;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }

  .shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 16px 96px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ==================== HOST TOOLBAR ==================== */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #ffffff;
    border: 1px solid #e2e2dd;
    border-radius: 14px;
    padding: 12px 16px;
  }
  .toolbar-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px 14px;
  }
  .toolbar-title {
    font-size: 15px;
    font-weight: 700;
    color: #141413;
  }
  .toolbar-sub {
    font-size: 12px;
    color: #666660;
  }
  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    justify-content: space-between;
  }
  .toolbar-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .toolbar-label {
    font-size: 12px;
    font-weight: 600;
    color: #666660;
    margin-right: 2px;
  }
  .ctrl-btn {
    border: 1px solid #d6d6d0;
    background: #f2f2ee;
    color: #1f1f1d;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  .ctrl-btn:hover { background: #e6e6e0; }
  .ctrl-btn.active {
    background: #171717;
    color: #ffffff;
    border-color: #171717;
  }

  .grid {
    display: grid;
    grid-template-columns: 398px minmax(300px, 1fr);
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; justify-items: center; }
    .side { width: 100%; max-width: 440px; }
  }

  /* ==================== FITTY PHONE FRAME ==================== */
  .phone {
    --f-bg: #0B0E0B;
    --f-surface: #141914;
    --f-surface-hi: #1C231C;
    --f-chip: #252D24;
    --f-outline: #343E33;
    --f-outline-hi: #4B5849;
    --f-primary: #C5FA55;
    --f-on-primary: #1A2506;
    --f-primary-container: #303E1B;
    --f-on-primary-container: #DDFF98;
    --f-badge-done: #1F2B0D;
    --f-text: #F0F3EA;
    --f-muted: #B6C1B3;
    --f-dim: #81907D;
    --f-heavy-accent: #C5FA55;
    --f-heavy-bg: #263315;
    --f-heavy-border: #486026;
    --f-heavy-text: #DDFF98;
    --f-light-accent: #7CE2D0;
    --f-light-bg: #162B28;
    --f-light-border: #2C5750;
    --f-light-text: #BFF6EC;
    --f-skip-bg: #232822;
    --f-skip-text: #8D988A;
    --f-warn: #F7D16B;
    --f-warn-bg: #2C2514;
    --f-warn-border: #594A22;

    width: 398px;
    height: 844px;
    background: var(--f-bg);
    color: var(--f-text);
    border-radius: 34px;
    border: 4px solid #222822;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
    position: relative;
    overflow: hidden;
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .phone button { font-family: Inter, system-ui, sans-serif; cursor: pointer; }
  .phone button:disabled { cursor: default; }

  .f-status {
    height: 30px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 22px 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--f-muted);
    z-index: 5;
  }

  .f-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 96px;
    scrollbar-width: none;
  }
  .f-scroll::-webkit-scrollbar { display: none; }

  .f-d {
    font-family: "Barlow Condensed", Inter, sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .f-num {
    font-family: "Barlow Condensed", Inter, sans-serif;
    font-weight: 700;
  }

  .f-brand {
    margin: 4px 0 12px;
    font-size: 30px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Program card (exact baseline from android-design-system.html) */
  .f-prog {
    background: var(--f-primary-container);
    border-radius: 18px;
    padding: 14px 18px;
    color: var(--f-on-primary-container);
  }
  .f-prog-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .f-prog-label { font-size: 12px; opacity: 0.85; }
  .f-prog-name { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.2; margin-top: 2px; }

  /* Section header */
  .f-sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 0 8px;
    gap: 8px;
  }
  .f-sec-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--f-muted);
    letter-spacing: 0.2px;
  }

  /* Horizontal day chips */
  .f-sc {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    margin-right: -20px;
    padding-right: 20px;
    padding-bottom: 2px;
  }
  .f-sc::-webkit-scrollbar { display: none; }
  .f-day-chip {
    flex: none;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    border: 1.5px solid var(--f-outline);
    background: transparent;
    color: var(--f-text);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background 120ms, border-color 120ms, color 120ms;
  }
  .f-day-chip:hover { border-color: var(--f-outline-hi); }
  .f-day-chip.selected {
    border-color: transparent;
    background: var(--f-primary);
    color: var(--f-on-primary);
  }
  .f-day-chip.selected.theme-light {
    background: var(--f-light-accent);
    color: #0B211E;
  }
  .f-day-chip.done:not(.selected) {
    background: #172115;
    border-color: #2E4222;
    color: #C7DBAE;
  }
  .f-day-chip.skipped:not(.selected) {
    background: #141714;
    border-style: dashed;
    border-color: #2D342C;
    color: var(--f-skip-text);
  }
  .f-day-chip.skipped:not(.selected) .chip-name {
    text-decoration: line-through;
    text-decoration-color: #657063;
  }
  .chip-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
  }
  .chip-mark-done { background: var(--f-badge-done); color: var(--f-primary); }
  .selected .chip-mark-done { background: rgba(26, 37, 6, 0.16); color: inherit; }
  .chip-mark-skip { background: #262C25; color: #9AA598; }
  .selected .chip-mark-skip { background: rgba(26, 37, 6, 0.16); color: inherit; }

  .chip-more-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    margin-left: 2px;
    margin-right: -4px;
    border-radius: 8px;
    border: 0;
    background: rgba(26, 37, 6, 0.14);
    color: inherit;
    padding: 0;
  }
  .chip-more-btn:hover { background: rgba(26, 37, 6, 0.24); }

  /* Exercise card */
  .f-card {
    background: var(--f-surface);
    border-radius: 20px;
    margin-top: 12px;
    padding: 0 16px;
    border: 1px solid #1E251E;
  }
  .f-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 0 10px;
  }
  .f-card-head-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--f-muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .f-ex-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid var(--f-chip);
  }
  .f-ex-row.no-top { border-top: 0; }
  .f-ex-idx {
    font-size: 16px;
    color: var(--f-dim);
    width: 20px;
    flex: none;
  }
  .f-ex-name {
    flex: 1;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 19px;
    color: var(--f-text);
  }
  .f-tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--f-chip);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--f-muted);
    white-space: nowrap;
  }
  .f-tag.light-target {
    background: var(--f-light-bg);
    color: var(--f-light-text);
    border: 1px solid #244842;
  }

  /* Primary CTA */
  .f-pb {
    margin-top: 12px;
    background: var(--f-primary);
    color: var(--f-on-primary);
    border: 0;
    border-radius: 999px;
    min-height: 48px;
    font-family: Inter, sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 90ms, filter 120ms;
  }
  .f-pb:active { transform: scale(0.985); }
  .f-pb.theme-light {
    background: var(--f-light-accent);
    color: #0B211E;
  }

  .f-ghost-btn {
    border: 0;
    background: transparent;
    color: var(--f-muted);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 120ms, color 120ms;
  }
  .f-ghost-btn:hover { background: var(--f-chip); color: var(--f-text); }

  .f-tonal-btn {
    border: 1px solid var(--f-outline);
    background: var(--f-surface-hi);
    color: var(--f-text);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .f-tonal-btn:hover { background: var(--f-chip); }

  /* ==================== VARIANT A: DEDICATED WEEK BAR ==================== */
  .va-week-card {
    margin-top: 12px;
    background: var(--f-surface);
    border: 1px solid #242D24;
    border-radius: 18px;
    padding: 12px 14px;
  }
  .va-week-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .va-week-eyebrow {
    font-size: 12px;
    color: var(--f-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .va-seg {
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: #0D110D;
    border: 1px solid var(--f-chip);
    border-radius: 13px;
    padding: 3px;
  }
  .va-seg-btn {
    border: 0;
    border-radius: 10px;
    min-height: 36px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    color: var(--f-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 140ms, color 140ms;
  }
  .va-seg-btn.active-heavy {
    background: var(--f-heavy-bg);
    color: var(--f-heavy-text);
    box-shadow: inset 0 0 0 1px var(--f-heavy-border);
  }
  .va-seg-btn.active-light {
    background: var(--f-light-bg);
    color: var(--f-light-text);
    box-shadow: inset 0 0 0 1px var(--f-light-border);
  }
  .va-locked-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    color: inherit;
  }
  .va-pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .va-pill-badge.heavy {
    background: var(--f-heavy-bg);
    color: var(--f-heavy-text);
    border: 1px solid var(--f-heavy-border);
  }
  .va-pill-badge.light {
    background: var(--f-light-bg);
    color: var(--f-light-text);
    border: 1px solid var(--f-light-border);
  }
  .va-progress-bar {
    margin-top: 10px;
    display: flex;
    gap: 5px;
  }
  .va-slot {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: #232B23;
  }
  .va-slot.done.heavy { background: var(--f-heavy-accent); }
  .va-slot.done.light { background: var(--f-light-accent); }
  .va-slot.skipped {
    background: repeating-linear-gradient(
      -45deg,
      #4A5449,
      #4A5449 3px,
      #252C24 3px,
      #252C24 6px
    );
  }
  .va-hint {
    margin-top: 8px;
    font-size: 12px;
    color: var(--f-muted);
    background: #1A211A;
    border-radius: 10px;
    padding: 8px 10px;
    line-height: 1.4;
  }

  /* ==================== VARIANT B: PROGRAM-EMBEDDED + CHIP MENU ==================== */
  .vb-prog-footer {
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid rgba(221, 255, 152, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .vb-week-trigger {
    border: 1px solid rgba(221, 255, 152, 0.28);
    background: rgba(11, 14, 11, 0.28);
    color: #EEFFCA;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .vb-week-trigger.is-light {
    border-color: rgba(124, 226, 208, 0.45);
    background: rgba(22, 43, 40, 0.78);
    color: var(--f-light-text);
  }
  .vb-week-trigger.is-locked {
    border-color: rgba(221, 255, 152, 0.14);
    background: rgba(11, 14, 11, 0.18);
  }
  .vb-dots {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: rgba(221, 255, 152, 0.85);
  }
  .vb-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid rgba(221, 255, 152, 0.5);
  }
  .vb-dot.done { background: var(--f-primary); border-color: var(--f-primary); }
  .vb-dot.done.light { background: var(--f-light-accent); border-color: var(--f-light-accent); }
  .vb-dot.skipped { background: transparent; border-style: dashed; opacity: 0.65; }

  .vb-inline-panel {
    margin-top: 10px;
    background: var(--f-surface-hi);
    border: 1px solid var(--f-outline);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .vb-inline-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .vb-inline-text {
    font-size: 12.5px;
    color: var(--f-text);
    line-height: 1.38;
  }
  .vb-inline-text span {
    display: block;
    font-size: 11.5px;
    color: var(--f-muted);
    margin-top: 2px;
  }
  .vb-inline-actions {
    display: flex;
    gap: 6px;
  }
  .vb-confirm-btn {
    flex: 1;
    border: 0;
    border-radius: 10px;
    min-height: 36px;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--f-warn-bg);
    color: var(--f-warn);
    border: 1px solid var(--f-warn-border);
  }
  .vb-cancel-btn {
    border: 1px solid var(--f-outline);
    border-radius: 10px;
    min-height: 36px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: 600;
    background: transparent;
    color: var(--f-muted);
  }

  /* ==================== VARIANT C: PASS CHECKLIST ACCORDION ==================== */
  .vc-mode-grid {
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .vc-mode-card {
    border: 1.5px solid var(--f-outline);
    background: var(--f-surface);
    border-radius: 16px;
    padding: 10px 12px;
    text-align: left;
    color: var(--f-text);
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: border-color 120ms, background 120ms;
  }
  .vc-mode-card.active-heavy {
    border-color: var(--f-heavy-accent);
    background: #1C2711;
  }
  .vc-mode-card.active-light {
    border-color: var(--f-light-accent);
    background: #132623;
  }
  .vc-mode-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13.5px;
    font-weight: 700;
  }
  .vc-mode-sub {
    font-size: 11.5px;
    color: var(--f-muted);
  }
  .vc-rec-tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--f-muted);
  }
  .active-heavy .vc-rec-tag { background: rgba(197, 250, 85, 0.18); color: var(--f-heavy-text); }
  .active-light .vc-rec-tag { background: rgba(124, 226, 208, 0.18); color: var(--f-light-text); }

  .vc-locked-strip {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 14px;
    background: var(--f-surface);
    border: 1px solid #222B22;
    width: 100%;
    color: var(--f-text);
  }

  .vc-list {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .vc-day-item {
    background: var(--f-surface);
    border: 1px solid #202820;
    border-radius: 18px;
    overflow: hidden;
  }
  .vc-day-item.expanded {
    border-color: var(--f-outline-hi);
  }
  .vc-day-item.expanded.heavy { border-color: #496127; }
  .vc-day-item.expanded.light { border-color: #2E5B53; }
  .vc-day-head {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--f-text);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    text-align: left;
  }
  .vc-day-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .vc-status-ico {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex: none;
  }
  .vc-status-ico.todo { border: 1.5px solid var(--f-outline-hi); color: var(--f-muted); }
  .vc-status-ico.active-heavy { background: var(--f-primary); color: var(--f-on-primary); }
  .vc-status-ico.active-light { background: var(--f-light-accent); color: #0B211E; }
  .vc-status-ico.done { background: var(--f-badge-done); color: var(--f-primary); border: 1px solid #3A501E; }
  .vc-status-ico.skipped { background: #222721; color: var(--f-skip-text); border: 1px dashed #444E43; }

  .vc-day-body {
    padding: 0 14px 14px;
  }
  .vc-day-footer {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .vc-skip-link {
    border: 0;
    background: transparent;
    color: var(--f-dim);
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px;
    border-radius: 10px;
    width: 100%;
    text-align: center;
  }

<script>
(() => {
  const VARIANTS = [
    {
      key: 'A',
      name: 'Карточка прохода + шторка',
      summary: 'Отдельная карточка тренировочной недели под программой. До старта — 1-тап сегмент «Тяжёлая / Лёгкая»; в середине прохода сворачивается в зафиксированный статус с полосой прогресса. Пропуск дня — кнопка в заголовке карточки упражнений, подтверждается в нижней шторке.',
      pros: [
        'Смена варианта перед проходом видна сразу и срабатывает в 1 тап.',
        'Полоса прогресса наглядно показывает выполненные, пропущенные и оставшиеся дни.',
        'Нижняя шторка надёжно страхует от случайного пропуска и явно предупреждает о завершении прохода на последнем дне.'
      ],
      tradeoffs: [
        'Добавляет отдельный блок между программой и чипами дней (чуть плотнее по вертикали, особенно когда рядом появится опрос о самочувствии).'
      ]
    },
    {
      key: 'B',
      name: 'В шапке программы + меню на чипе',
      summary: 'Никаких лишних карточек: вариант недели и точки прогресса встроены в зелёную карточку программы. Смена перед проходом открывает компактную шторку выбора; пропуск дня живёт прямо на выбранном чипе дня (кнопка «⋯») с двухшаговым встроенным подтверждением под чипами.',
      pros: [
        'Почти не меняет вертикальный ритм базовой Главной — больше места для упражнений и будущего опроса о самочувствии.',
        'Смена варианта через шторку с коротким пояснением (прогрессия / разгрузка) исключает случайный тап.',
        'Пропуск привязан к самому чипу дня, а не к списку упражнений, и подтверждается без перекрытия экрана.'
      ],
      tradeoffs: [
        'Кнопка «⋯» на чипе менее очевидна с первого взгляда, чем явная текстовая кнопка пропуска.',
        'Смена варианта до старта требует 2 тапа (открыть шторку → выбрать).'
      ]
    },
    {
      key: 'C',
      name: 'Чеклист прохода (аккордеон)',
      summary: 'При включённом чередовании горизонтальные чипы заменяются вертикальным чеклистом текущего прохода. До старта наверху две крупные карточки режима; в процессе — компактная строка статуса. Выполненные и пропущенные дни свёрнуты в одну строку (пропущенный можно вернуть прямо там), а активный день раскрыт со списком упражнений и встроенным подтверждением пропуска под CTA.',
      pros: [
        'Весь проход недели читается сверху вниз как единый чеклист: сразу видно, что сделано, что пропущено и что осталось.',
        'Пропущенный день можно вернуть в текущий проход одним тапом («Вернуть»), пока проход ещё не закрыт.',
        'Естественно масштабируется без горизонтальной прокрутки (3–5 дней видны одновременно).'
      ],
      tradeoffs: [
        'При 5+ днях свёрнутые строки занимают вертикальное место и отличаются от привычных горизонтальных чипов при выключенном чередовании.'
      ]
    }
  ];

  const PROGRAM_DAYS_ALL = [
    {
      id: 'A',
      name: 'День A',
      subtitle: 'Ноги и жим',
      exercises: [
        { name: 'Присед со штангой на груди', heavy: '3 × 8–12', light: '3 × 6–10' },
        { name: 'Жим штанги лёжа', heavy: '3 × 8', light: '3 × 6' },
        { name: 'Тяга штанги в наклоне', heavy: '4 × 10', light: '4 × 8' },
        { name: 'Планка на предплечьях', heavy: '3 × 0:45', light: '3 × 0:35' }
      ]
    },
    {
      id: 'B',
      name: 'День B',
      subtitle: 'Тяга и плечи',
      exercises: [
        { name: 'Румынская тяга с гантелями', heavy: '3 × 8–10', light: '3 × 6–8' },
        { name: 'Жим гантелей сидя', heavy: '3 × 10', light: '3 × 8' },
        { name: 'Подтягивания широким хватом', heavy: '3 × 8', light: '3 × 6' },
        { name: 'Подъём на носки стоя', heavy: '3 × 12', light: '3 × 10' }
      ]
    },
    {
      id: 'C',
      name: 'День C',
      subtitle: 'Спина и верх',
      exercises: [
        { name: 'Становая тяга классическая', heavy: '3 × 1–3', light: '3 × 1–3 · легче вес' },
        { name: 'Жим на наклонной скамье', heavy: '3 × 8–12', light: '3 × 6–10' },
        { name: 'Тяга верхнего блока', heavy: '3 × 10', light: '3 × 8' },
        { name: 'Сгибания на бицепс', heavy: '3 × 12', light: '3 × 10' }
      ]
    },
    {
      id: 'D',
      name: 'День D',
      subtitle: 'Выпады и руки',
      exercises: [
        { name: 'Болгарские выпады', heavy: '3 × 10', light: '3 × 8' },
        { name: 'Отжимания на брусьях', heavy: '3 × 8–10', light: '3 × 6–8' },
        { name: 'Тяга гантели одной рукой', heavy: '3 × 10', light: '3 × 8' }
      ]
    },
    {
      id: 'E',
      name: 'День E',
      subtitle: 'Кор и кондиция',
      exercises: [
        { name: 'Жим ногами в тренажёре', heavy: '3 × 10–12', light: '3 × 8–10' },
        { name: 'Тяга к лицу в кроссовере', heavy: '3 × 15', light: '3 × 12' },
        { name: 'Прогулка фермера', heavy: '3 × 40 м', light: '3 × 30 м' }
      ]
    }
  ];

  const ICONS = {
    chevronRight: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    chevronDown: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    lock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
    swap: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l-4 4 4 4"/><path d="M3 14h14"/><path d="M17 14l4-4-4-4"/><path d="M21 10H7"/></svg>',
    skip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>',
    more: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>',
    history: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    settings: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>'
  };

  function getInitialVariant() {
    try {
      const p = new URLSearchParams(window.location.search).get('variant');
      if (p && VARIANTS.some(v => v.key === p.toUpperCase())) return p.toUpperCase();
    } catch (_) {}
    return 'A';
  }

  const state = {
    variant: getInitialVariant(),
    preset: 'new_heavy',
    dayCount: 3,
    alternating: true,
    passNumber: 1,
    proposedWeek: 'heavy',
    currentWeek: 'heavy',
    dayStatus: { A: 'todo', B: 'todo', C: 'todo' }, // 'todo' | 'done' | 'skipped'
    selectedDay: 'A',
    lockedHintVisible: false,
    // Interactive UI overlays
    sheet: null, // null | { type: 'skip', dayId } | { type: 'pick_week' } | { type: 'locked_info' }
    vbMenuOpenFor: null, // dayId
    vbConfirmSkipFor: null, // dayId
    vcConfirmSkipFor: null, // dayId
    transitionBanner: null, // null | { text, variant, canUndo }
    snack: null, // null | { text, undoSnapshot }
    undoSnapshot: null,
    historyPasses: [],
    logs: ['Открыт новый проход: предложена тяжёлая неделя (0 из 3).']
  };

  function getDays() {
    return PROGRAM_DAYS_ALL.slice(0, state.dayCount);
  }

  function passProgress() {
    const days = getDays();
    let done = 0, skipped = 0, todo = 0;
    for (const d of days) {
      const st = state.dayStatus[d.id] || 'todo';
      if (st === 'done') done++;
      else if (st === 'skipped') skipped++;
      else todo++;
    }
    return { total: days.length, done, skipped, todo, resolved: done + skipped };
  }

  function isPassLocked() {
    if (!state.alternating) return false;
    return passProgress().resolved > 0;
  }

  function firstTodoDayId() {
    const days = getDays();
    const found = days.find(d => (state.dayStatus[d.id] || 'todo') === 'todo');
    return found ? found.id : days[0].id;
  }

  function weekLabel(w) {
    return w === 'heavy' ? 'Тяжёлая неделя' : 'Лёгкая неделя';
  }

  function weekShort(w) {
    return w === 'heavy' ? 'Тяжёлая' : 'Лёгкая';
  }

  function oppositeWeek(w) {
    return w === 'heavy' ? 'light' : 'heavy';
  }

  function pushLog(msg) {
    state.logs.unshift(msg);
    if (state.logs.length > 8) state.logs.pop();
  }

  function takeSnapshot() {
    return {
      passNumber: state.passNumber,
      proposedWeek: state.proposedWeek,
      currentWeek: state.currentWeek,
      dayStatus: { ...state.dayStatus },
      selectedDay: state.selectedDay,
      historyPasses: state.historyPasses.slice()
    };
  }

  function restoreSnapshot(snap, reason) {
    state.passNumber = snap.passNumber;
    state.proposedWeek = snap.proposedWeek;
    state.currentWeek = snap.currentWeek;
    state.dayStatus = { ...snap.dayStatus };
    state.selectedDay = snap.selectedDay;
    state.historyPasses = snap.historyPasses.slice();
    state.sheet = null;
    state.vbMenuOpenFor = null;
    state.vbConfirmSkipFor = null;
    state.vcConfirmSkipFor = null;
    state.transitionBanner = null;
    state.snack = null;
    state.undoSnapshot = null;
    pushLog(reason || 'Действие отменено.');
    render();
  }

  function clearEphemeral() {
    state.sheet = null;
    state.vbMenuOpenFor = null;
    state.vbConfirmSkipFor = null;
    state.vcConfirmSkipFor = null;
    state.lockedHintVisible = false;
  }

  function applyPreset(presetName) {
    state.preset = presetName;
    clearEphemeral();
    state.transitionBanner = null;
    state.snack = null;
    state.undoSnapshot = null;

    const days = getDays();
    const blank = {};
    days.forEach(d => blank[d.id] = 'todo');

    if (presetName === 'alt_off') {
      state.alternating = false;
      state.dayStatus = blank;
      state.selectedDay = 'A';
      pushLog('Переключён сценарий: чередование выключено (чистая Главная).');
    } else if (presetName === 'new_heavy') {
      state.alternating = true;
      state.passNumber = 1;
      state.proposedWeek = 'heavy';
      state.currentWeek = 'heavy';
      state.dayStatus = blank;
      state.selectedDay = 'A';
      state.historyPasses = [];
      pushLog('Сценарий: новый проход (0/' + days.length + '), предложена тяжёлая неделя.');
    } else if (presetName === 'mid_pass') {
      state.alternating = true;
      state.passNumber = 1;
      state.proposedWeek = 'heavy';
      state.currentWeek = 'heavy';
      state.dayStatus = { ...blank, A: 'done' };
      state.selectedDay = 'B';
      state.historyPasses = [];
      pushLog('Сценарий: середина прохода (День A выполнен, тяжёлая зафиксирована).');
    } else if (presetName === 'last_day') {
      state.alternating = true;
      state.passNumber = 1;
      state.proposedWeek = 'heavy';
      state.currentWeek = 'heavy';
      const status = { ...blank };
      days.forEach(d => { if (d.id !== 'B') status[d.id] = 'done'; });
      state.dayStatus = status;
      state.selectedDay = 'B';
      state.historyPasses = [];
      pushLog('Сценарий: остался последний день прохода (День B). Попробуйте его пропустить.');
    } else if (presetName === 'new_light') {
      state.alternating = true;
      state.passNumber = 2;
      state.proposedWeek = 'light';
      state.currentWeek = 'light';
      state.dayStatus = blank;
      state.selectedDay = 'A';
      state.historyPasses = ['Проход 1: Тяжёлая (2 вып., 1 проп.)'];
      state.transitionBanner = {
        text: 'Тяжёлая неделя завершена. Предложена лёгкая — можно сменить до старта.',
        variant: 'light',
        canUndo: false
      };
      pushLog('Сценарий: тяжёлый проход завершён, предложена лёгкая неделя (День B снова доступен).');
    }
    render();
  }

  function setDayCount(n) {
    state.dayCount = n;
    applyPreset(state.preset);
  }

  function switchWeekVariant(nextWeek) {
    if (isPassLocked()) {
      state.lockedHintVisible = true;
      pushLog('Попытка сменить вариант посреди прохода — заблокировано.');
      render();
      return;
    }
    if (state.currentWeek === nextWeek) {
      state.sheet = null;
      render();
      return;
    }
    state.currentWeek = nextWeek;
    state.sheet = null;
    pushLog('Вариант до старта изменён вручную на: ' + weekLabel(nextWeek) + '.');
    render();
  }

  function advanceIfPassCompleted(viaSkip, lastDayId, snapshot) {
    const p = passProgress();
    if (p.todo > 0) {
      state.selectedDay = firstTodoDayId();
      if (viaSkip) {
        state.undoSnapshot = snapshot;
        state.snack = {
          text: `День ${lastDayId} пропущен в этой неделе`,
          canUndo: true
        };
      }
      return;
    }

    // All days in current pass are either done or skipped -> complete pass & propose opposite!
    const finishedWeek = state.currentWeek;
    const nextWeek = oppositeWeek(finishedWeek);
    state.historyPasses.push(
      `Проход ${state.passNumber}: ${weekShort(finishedWeek)} (${p.done} вып., ${p.skipped} проп.)`
    );
    state.passNumber += 1;
    state.proposedWeek = nextWeek;
    state.currentWeek = nextWeek;
    const days = getDays();
    const reset = {};
    days.forEach(d => reset[d.id] = 'todo');
    state.dayStatus = reset;
    state.selectedDay = days[0].id;
    state.lockedHintVisible = false;

    const triggerWord = viaSkip ? `День ${lastDayId} пропущен — ` : `День ${lastDayId} выполнен — `;
    state.transitionBanner = {
      text: `${weekLabel(finishedWeek)} завершена. Предложена ${weekLabel(nextWeek).toLowerCase()} (все дни снова доступны).`,
      variant: nextWeek,
      canUndo: viaSkip
    };
    state.undoSnapshot = viaSkip ? snapshot : null;
    state.snack = viaSkip
      ? { text: `${triggerWord}открыта ${weekLabel(nextWeek).toLowerCase()}`, canUndo: true }
      : { text: `Проход завершён · предложена ${weekLabel(nextWeek).toLowerCase()}`, canUndo: false };

    pushLog(`${triggerWord}проход завершён → предложена ${weekLabel(nextWeek)}.`);
  }

  function confirmSkipDay(dayId) {
    const snap = takeSnapshot();
    clearEphemeral();
    state.transitionBanner = null;
    state.dayStatus[dayId] = 'skipped';
    pushLog(`День ${dayId} пропущен в текущем проходе (${weekShort(state.currentWeek)}).`);
    advanceIfPassCompleted(true, dayId, snap);
    render();
  }

  function restoreSkippedDay(dayId) {
    if (state.dayStatus[dayId] !== 'skipped') return;
    state.dayStatus[dayId] = 'todo';
    state.selectedDay = dayId;
    state.snack = { text: `День ${dayId} возвращён в текущую неделю`, canUndo: false };
    pushLog(`День ${dayId} возвращён в текущий проход.`);
    render();
  }

  function simulateWorkoutStart(dayId) {
    clearEphemeral();
    state.transitionBanner = null;
    if (!state.alternating) {
      const days = getDays();
      const idx = days.findIndex(d => d.id === dayId);
      const next = days[(idx + 1) % days.length];
      state.selectedDay = next.id;
      state.snack = { text: `День ${dayId} завершён · предложен ${next.name}`, canUndo: false };
      pushLog(`(Без чередования) День ${dayId} завершён → предложен ${next.name}.`);
      render();
      return;
    }

    const snap = takeSnapshot();
    state.dayStatus[dayId] = 'done';
    state.snack = {
      text: `День ${dayId} · ${weekShort(state.currentWeek)} записан`,
      canUndo: false
    };
    pushLog(`День ${dayId} выполнен (${weekShort(state.currentWeek)}).`);
    advanceIfPassCompleted(false, dayId, snap);
    render();
  }

  function updateUrl() {
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('variant', state.variant);
      window.history.replaceState({}, '', url.toString());
    } catch (_) {}
  }

  function renderExercises(day, includeHeaderActionHtml) {
    const useLightTargets = state.alternating && state.currentWeek === 'light';
    const rows = day.exercises.map((ex, idx) => {
      const target = useLightTargets ? ex.light : ex.heavy;
      const topClass = !includeHeaderActionHtml && idx === 0 ? 'no-top' : '';
      return `
        <div class="f-ex-row ${topClass}">
          <span class="f-d f-ex-idx">0${idx + 1}</span>
          <span class="f-ex-name">${ex.name}</span>
          <span class="f-tag ${useLightTargets ? 'light-target' : ''}">${target}</span>
        </div>
      `;
    }).join('');
    return `
      <div class="f-card">
        ${includeHeaderActionHtml || ''}
        ${rows}
      </div>
    `;
  }

  function renderTransitionBanner() {
    if (!state.transitionBanner) return '';
    const b = state.transitionBanner;
    return `
      <div class="f-banner ${b.variant === 'heavy' ? 'heavy' : ''}">
        <span>${b.text}</span>
        ${b.canUndo && state.undoSnapshot ? '<button class="f-banner-btn" id="btn-banner-undo">Отменить</button>' : '<button class="f-banner-btn" id="btn-banner-close">Ок</button>'}
      </div>
    `;
  }

  function renderBaselineOffHome() {
    const days = getDays();
    const day = days.find(d => d.id === state.selectedDay) || days[0];
    const chips = days.map(d => `
      <button class="f-day-chip ${d.id === day.id ? 'selected' : ''}" data-select-day="${d.id}">
        <span class="chip-name">${d.name}</span>
      </button>
    `).join('');

    return `
      <div class="f-prog">
        <div class="f-prog-top">
          <div>
            <div class="f-prog-label">Мои программы</div>
            <div class="f-prog-name">Базовая силовая</div>
          </div>
          ${ICONS.chevronRight}
        </div>
      </div>

      <div class="f-sec-head">
        <div class="f-sec-title">Тренировочный день · ${days.length}</div>
      </div>
      <div class="f-sc">${chips}</div>
      ${renderExercises(day, '')}
      <button class="f-pb" id="btn-start-workout">Начать тренировку</button>
    `;
  }

  /* ==================== VARIANT A RENDER ==================== */
  function renderVariantA() {
    const days = getDays();
    const day = days.find(d => d.id === state.selectedDay) || days[0];
    const locked = isPassLocked();
    const p = passProgress();
    const isLight = state.currentWeek === 'light';
    const daySt = state.dayStatus[day.id] || 'todo';

    let weekBlock = '';
    if (!locked) {
      weekBlock = `
        <div class="va-week-card">
          <div class="va-week-top">
            <div class="va-week-eyebrow">
              <span>Новый проход · ${p.total} дн.</span>
            </div>
            <span style="font-size:11.5px;color:var(--f-dim)">Можно сменить до старта</span>
          </div>
          <div class="va-seg" role="tablist" aria-label="Вариант тренировочной недели">
            <button class="va-seg-btn ${!isLight ? 'active-heavy' : ''}" data-set-week="heavy" aria-selected="${!isLight}">
              Тяжёлая${state.proposedWeek === 'heavy' ? ' · план' : ''}
            </button>
            <button class="va-seg-btn ${isLight ? 'active-light' : ''}" data-set-week="light" aria-selected="${isLight}">
              Лёгкая${state.proposedWeek === 'light' ? ' · план' : ''}
            </button>
          </div>
        </div>
      `;
    } else {
      const slots = days.map(d => {
        const st = state.dayStatus[d.id] || 'todo';
        return `<div class="va-slot ${st} ${state.currentWeek}" title="${d.name}: ${st}"></div>`;
      }).join('');
      weekBlock = `
        <div class="va-week-card">
          <button class="va-locked-row" id="va-locked-toggle" aria-expanded="${state.lockedHintVisible}">
            <span class="va-pill-badge ${state.currentWeek}">
              ${ICONS.lock}
              <span>${weekLabel(state.currentWeek)}</span>
            </span>
            <span style="font-size:12.5px;color:var(--f-muted);font-weight:600">${p.resolved} из ${p.total}</span>
          </button>
          <div class="va-progress-bar">${slots}</div>
          ${state.lockedHintVisible ? `
            <div class="va-hint">
              Вариант зафиксирован на текущий проход. Когда останутся 0 дней, Fitty предложит ${weekLabel(oppositeWeek(state.currentWeek)).toLowerCase()}. Облегчить одно занятие можно внутри тренировки.
            </div>
          ` : ''}
        </div>
      `;
    }

    const chips = days.map(d => {
      const st = state.dayStatus[d.id] || 'todo';
      const sel = d.id === day.id;
      const mark = st === 'done'
        ? '<span class="chip-mark chip-mark-done" aria-label="Выполнен">✓</span>'
        : st === 'skipped'
          ? '<span class="chip-mark chip-mark-skip" aria-label="Пропущен">⊘</span>'
          : '';
      return `
        <button class="f-day-chip ${sel ? 'selected' : ''} ${sel && isLight ? 'theme-light' : ''} ${st}" data-select-day="${d.id}">
          <span class="chip-name">${d.name}</span>
          ${mark}
        </button>
      `;
    }).join('');

    const canSkip = daySt === 'todo';
    const cardHead = `
      <div class="f-card-head">
        <div class="f-card-head-title">
          <span>${day.name}</span>
          <span style="color:var(--f-dim)">· ${day.exercises.length} упр.</span>
        </div>
        ${canSkip ? `
          <button class="f-ghost-btn" id="va-open-skip" style="padding:4px 8px;font-size:12.5px">
            ${ICONS.skip}
            <span>Пропустить день</span>
          </button>
        ` : (daySt === 'skipped' ? `
          <button class="vc-restore-pill" data-restore-day="${day.id}">Вернуть в неделю</button>
        ` : `<span style="font-size:12px;color:#A7CF64;font-weight:600">Выполнен в проходе</span>`)}
      </div>
    `;

    const ctaLabel = daySt === 'done'
      ? `Повторить ${day.name}`
      : daySt === 'skipped'
        ? `Всё-таки начать ${day.name}`
        : `Начать · ${day.name}`;

    return `
      <div class="f-prog">
        <div class="f-prog-top">
          <div>
            <div class="f-prog-label">Мои программы</div>
            <div class="f-prog-name">Базовая силовая</div>
          </div>
          ${ICONS.chevronRight}
        </div>
      </div>

      ${renderTransitionBanner()}
      ${weekBlock}

      <div class="f-sec-head">
        <div class="f-sec-title">Тренировочный день · ${p.todo} осталось</div>
      </div>
      <div class="f-sc">${chips}</div>
      ${renderExercises(day, cardHead)}
      <button class="f-pb ${isLight ? 'theme-light' : ''}" id="btn-start-workout">${ctaLabel}</button>
    `;
  }

  /* ==================== VARIANT B RENDER ==================== */
  function renderVariantB() {
    const days = getDays();
    const day = days.find(d => d.id === state.selectedDay) || days[0];
    const locked = isPassLocked();
    const p = passProgress();
    const isLight = state.currentWeek === 'light';
    const daySt = state.dayStatus[day.id] || 'todo';

    const dots = days.map(d => {
      const st = state.dayStatus[d.id] || 'todo';
      return `<span class="vb-dot ${st} ${isLight ? 'light' : ''}" title="${d.name}"></span>`;
    }).join('');

    const weekPill = locked
      ? `<button class="vb-week-trigger is-locked ${isLight ? 'is-light' : ''}" id="vb-open-locked">
           ${ICONS.lock}
           <span>${weekLabel(state.currentWeek)}</span>
         </button>`
      : `<button class="vb-week-trigger ${isLight ? 'is-light' : ''}" id="vb-open-week-picker">
           <span>${weekLabel(state.currentWeek)}</span>
           ${ICONS.swap}
         </button>`;

    const chips = days.map(d => {
      const st = state.dayStatus[d.id] || 'todo';
      const sel = d.id === day.id;
      const mark = st === 'done'
        ? '<span class="chip-mark chip-mark-done">✓</span>'
        : st === 'skipped'
          ? '<span class="chip-mark chip-mark-skip">⊘</span>'
          : '';
      const moreBtn = sel && st !== 'done'
        ? `<span class="chip-more-btn" role="button" tabindex="0" data-vb-more="${d.id}" aria-label="Действия с ${d.name}">${ICONS.more}</span>`
        : '';
      return `
        <button class="f-day-chip ${sel ? 'selected' : ''} ${sel && isLight ? 'theme-light' : ''} ${st}" data-select-day="${d.id}">
          <span class="chip-name">${d.name}</span>
          ${mark}
          ${moreBtn}
        </button>
      `;
    }).join('');

    let inlineActionPanel = '';
    if (state.vbConfirmSkipFor === day.id) {
      const willFinish = p.todo === 1 && daySt === 'todo';
      inlineActionPanel = `
        <div class="vb-inline-panel">
          <div class="vb-inline-text">
            Пропустить ${day.name} только в этой неделе?
            <span>${willFinish
              ? `Это последний день прохода — после пропуска Fitty предложит ${weekLabel(oppositeWeek(state.currentWeek)).toLowerCase()}.`
              : 'В следующей тренировочной неделе этот день снова появится в плане.'}</span>
          </div>
          <div class="vb-inline-actions">
            <button class="vb-confirm-btn" id="vb-do-skip">Да, пропустить</button>
            <button class="vb-cancel-btn" id="vb-cancel-skip">Отмена</button>
          </div>
        </div>
      `;
    } else if (state.vbMenuOpenFor === day.id) {
      inlineActionPanel = `
        <div class="vb-inline-panel">
          <div class="vb-inline-row">
            <div class="vb-inline-text">
              ${daySt === 'skipped' ? `${day.name} пропущен в этом проходе` : `Действия для ${day.name}`}
              <span>${daySt === 'skipped' ? 'Можно вернуть его обратно в текущую неделю.' : 'Пропуск действует только на текущий проход.'}</span>
            </div>
            ${daySt === 'skipped'
              ? `<button class="vc-restore-pill" data-restore-day="${day.id}">Вернуть</button>`
              : `<button class="f-tonal-btn" id="vb-step-confirm">${ICONS.skip}<span>Пропустить</span></button>`}
          </div>
        </div>
      `;
    }

    const dayNotice = daySt === 'skipped' && !inlineActionPanel
      ? `<div class="f-day-notice">
           <span>${day.name} пропущен в этой неделе</span>
           <button class="vc-restore-pill" data-restore-day="${day.id}">Вернуть</button>
         </div>`
      : '';

    return `
      <div class="f-prog">
        <div class="f-prog-top">
          <div>
            <div class="f-prog-label">Мои программы</div>
            <div class="f-prog-name">Базовая силовая</div>
          </div>
          ${ICONS.chevronRight}
        </div>
        <div class="vb-prog-footer">
          ${weekPill}
          <div class="vb-dots" aria-label="Прогресс прохода ${p.resolved} из ${p.total}">
            ${dots}
            <span style="margin-left:3px;font-weight:600">${p.resolved}/${p.total}</span>
          </div>
        </div>
      </div>

      ${renderTransitionBanner()}

      <div class="f-sec-head">
        <div class="f-sec-title">Тренировочный день · ${days.length}</div>
        ${daySt === 'todo' ? '<span style="font-size:11.5px;color:var(--f-dim)">Нажмите ⋯ для пропуска</span>' : ''}
      </div>
      <div class="f-sc">${chips}</div>
      ${inlineActionPanel}
      ${dayNotice}
      ${renderExercises(day, '')}
      <button class="f-pb ${isLight ? 'theme-light' : ''}" id="btn-start-workout">
        ${daySt === 'done' ? `Повторить ${day.name}` : 'Начать тренировку'}
      </button>
    `;
  }

  /* ==================== VARIANT C RENDER ==================== */
  function renderVariantC() {
    const days = getDays();
    const locked = isPassLocked();
    const p = passProgress();
    const isLight = state.currentWeek === 'light';

    let weekHeader = '';
    if (!locked) {
      weekHeader = `
        <div class="vc-mode-grid" role="radiogroup" aria-label="Выбор варианта недели">
          <button class="vc-mode-card ${!isLight ? 'active-heavy' : ''}" data-set-week="heavy">
            <div class="vc-mode-top">
              <span>Тяжёлая</span>
              ${state.proposedWeek === 'heavy' ? '<span class="vc-rec-tag">План</span>' : ''}
            </div>
            <div class="vc-mode-sub">Рабочий вес · прогрессия</div>
          </button>
          <button class="vc-mode-card ${isLight ? 'active-light' : ''}" data-set-week="light">
            <div class="vc-mode-top">
              <span>Лёгкая</span>
              ${state.proposedWeek === 'light' ? '<span class="vc-rec-tag">План</span>' : ''}
            </div>
            <div class="vc-mode-sub">Разгрузка · −2 повт.</div>
          </button>
        </div>
      `;
    } else {
      weekHeader = `
        <button class="vc-locked-strip" id="vc-locked-toggle">
          <span class="va-pill-badge ${state.currentWeek}" style="padding:4px 9px;font-size:12.5px">
            ${ICONS.lock}
            <span>${weekLabel(state.currentWeek)}</span>
          </span>
          <span style="font-size:12.5px;color:var(--f-muted)">Осталось ${p.todo} из ${p.total}</span>
        </button>
        ${state.lockedHintVisible ? `
          <div class="va-hint">
            Вариант зафиксирован до конца прохода. После завершения или пропуска оставшихся дней откроется ${weekLabel(oppositeWeek(state.currentWeek)).toLowerCase()}.
          </div>
        ` : ''}
      `;
    }

    const useLightTargets = state.currentWeek === 'light';
    const items = days.map(d => {
      const st = state.dayStatus[d.id] || 'todo';
      const expanded = d.id === state.selectedDay;
      const icoClass = st === 'done'
        ? 'done'
        : st === 'skipped'
          ? 'skipped'
          : expanded
            ? (isLight ? 'active-light' : 'active-heavy')
            : 'todo';
      const icoChar = st === 'done' ? '✓' : st === 'skipped' ? '⊘' : d.id;

      const rightMeta = st === 'done'
        ? '<span style="font-size:12px;color:#A7CF64;font-weight:600">Выполнен</span>'
        : st === 'skipped'
          ? `<span class="vc-restore-pill" role="button" tabindex="0" data-restore-day="${d.id}">Вернуть</span>`
          : `<span style="font-size:12px;color:var(--f-dim);display:inline-flex;align-items:center;gap:4px">${d.exercises.length} упр. ${expanded ? '' : ICONS.chevronDown}</span>`;

      let bodyHtml = '';
      if (expanded) {
        const rows = d.exercises.map((ex, idx) => `
          <div class="f-ex-row ${idx === 0 ? '' : ''}">
            <span class="f-d f-ex-idx">0${idx + 1}</span>
            <span class="f-ex-name">${ex.name}</span>
            <span class="f-tag ${useLightTargets ? 'light-target' : ''}">${useLightTargets ? ex.light : ex.heavy}</span>
          </div>
        `).join('');

        const willFinish = p.todo === 1 && st === 'todo';
        let skipSection = '';
        if (st === 'todo') {
          if (state.vcConfirmSkipFor === d.id) {
            skipSection = `
              <div class="vb-inline-panel" style="margin-top:4px">
                <div class="vb-inline-text">
                  Пропустить ${d.name} в этой неделе?
                  <span>${willFinish
                    ? `Проход завершится и откроется ${weekLabel(oppositeWeek(state.currentWeek)).toLowerCase()}.`
                    : 'День вернётся в следующем проходе.'}</span>
                </div>
                <div class="vb-inline-actions">
                  <button class="vb-confirm-btn" id="vc-do-skip">Пропустить</button>
                  <button class="vb-cancel-btn" id="vc-cancel-skip">Отмена</button>
                </div>
              </div>
            `;
          } else {
            skipSection = `<button class="vc-skip-link" id="vc-ask-skip">Пропустить ${d.name} в этой тренировочной неделе</button>`;
          }
        }

        bodyHtml = `
          <div class="vc-day-body">
            ${rows}
            <div class="vc-day-footer">
              <button class="f-pb ${isLight ? 'theme-light' : ''}" id="btn-start-workout" style="margin-top:6px">
                ${st === 'done' ? `Повторить ${d.name}` : `Начать ${d.name}`}
              </button>
              ${skipSection}
            </div>
          </div>
        `;
      }

      return `
        <div class="vc-day-item ${expanded ? 'expanded ' + state.currentWeek : ''}">
          <button class="vc-day-head" data-select-day="${d.id}">
            <div class="vc-day-left">
              <span class="vc-status-ico ${icoClass}">${icoChar}</span>
              <div>
                <div style="font-size:15px;font-weight:600;${st === 'skipped' ? 'color:var(--f-skip-text);text-decoration:line-through' : ''}">${d.name}</div>
                <div style="font-size:12px;color:var(--f-dim)">${st === 'skipped' ? 'Пропущен в этой неделе' : d.subtitle}</div>
              </div>
            </div>
            ${rightMeta}
          </button>
          ${bodyHtml}
        </div>
      `;
    }).join('');

    return `
      <div class="f-prog">
        <div class="f-prog-top">
          <div>
            <div class="f-prog-label">Мои программы</div>
            <div class="f-prog-name">Базовая силовая</div>
          </div>
          ${ICONS.chevronRight}
        </div>
      </div>

      ${renderTransitionBanner()}
      ${weekHeader}
      <div class="vc-list">${items}</div>
    `;
  }

  /* ==================== SHEETS & SNACKBAR ==================== */
  function renderOverlay() {
    if (!state.sheet) return '';
    const s = state.sheet;

    if (s.type === 'skip') {
      const p = passProgress();
      const willFinish = p.todo === 1 && (state.dayStatus[s.dayId] || 'todo') === 'todo';
      const nextW = weekLabel(oppositeWeek(state.currentWeek)).toLowerCase();
      return `
        <div class="f-scrim" id="sheet-scrim">
          <div class="f-sheet" role="dialog" aria-modal="true" aria-label="Подтверждение пропуска дня">
            <div class="f-sheet-handle"></div>
            <h3>Пропустить День ${s.dayId} в этой неделе?</h3>
            <p>День пропустится только в текущем проходе (${weekLabel(state.currentWeek).toLowerCase()}). В следующей тренировочной неделе он снова будет в плане.</p>
            ${willFinish ? `
              <div class="f-sheet-callout">
                Это последний оставшийся день прохода. После пропуска текущая неделя завершится, и Fitty предложит <strong>${nextW}</strong> с Дня A.
              </div>
            ` : ''}
            <div class="f-sheet-actions">
              <button class="f-sheet-confirm" id="sheet-confirm-skip">Пропустить День ${s.dayId}</button>
              <button class="f-sheet-cancel" id="sheet-close">Отмена</button>
            </div>
          </div>
        </div>
      `;
    }

    if (s.type === 'pick_week') {
      const isLight = state.currentWeek === 'light';
      return `
        <div class="f-scrim" id="sheet-scrim">
          <div class="f-sheet" role="dialog" aria-modal="true" aria-label="Выбор варианта недели">
            <div class="f-sheet-handle"></div>
            <h3>Вариант тренировочной недели</h3>
            <p>Выбор действует на весь предстоящий проход. После старта первой тренировки переключить его будет нельзя.</p>
            <button class="f-sheet-radio ${!isLight ? 'sel-heavy' : ''}" data-set-week="heavy">
              <span class="f-radio-dot"></span>
              <div>
                <div style="font-size:15px;font-weight:700">Тяжёлая неделя ${state.proposedWeek === 'heavy' ? '· предложена' : ''}</div>
                <div style="font-size:12.5px;color:var(--f-muted);margin-top:2px">Основные цели программы и прогрессия рабочего веса</div>
              </div>
            </button>
            <button class="f-sheet-radio ${isLight ? 'sel-light' : ''}" data-set-week="light">
              <span class="f-radio-dot"></span>
              <div>
                <div style="font-size:15px;font-weight:700">Лёгкая неделя ${state.proposedWeek === 'light' ? '· предложена' : ''}</div>
                <div style="font-size:12.5px;color:var(--f-muted);margin-top:2px">Плановая разгрузка: вес сохранён, на 2 повтора меньше</div>
              </div>
            </button>
            <button class="f-sheet-cancel" id="sheet-close">Закрыть</button>
          </div>
        </div>
      `;
    }

    if (s.type === 'locked_info') {
      const p = passProgress();
      return `
        <div class="f-scrim" id="sheet-scrim">
          <div class="f-sheet" role="dialog" aria-modal="true" aria-label="Вариант недели зафиксирован">
            <div class="f-sheet-handle"></div>
            <h3>${weekLabel(state.currentWeek)} уже идёт</h3>
            <p>Пройдено ${p.resolved} из ${p.total} дн. Вариант недели фиксируется на весь проход, чтобы сохранять чистую историю подсказок.</p>
            <p>Когда все дни прохода будут выполнены или пропущены, Fitty предложит <strong>${weekLabel(oppositeWeek(state.currentWeek)).toLowerCase()}</strong>. Если устали сегодня — можно разово облегчить одну тренировку.</p>
            <button class="f-sheet-cancel" id="sheet-close">Понятно</button>
          </div>
        </div>
      `;
    }

    return '';
  }

  function renderSnack() {
    if (!state.snack) return '';
    return `
      <div class="f-snack" role="status">
        <span>${state.snack.text}</span>
        ${state.snack.canUndo && state.undoSnapshot ? '<button class="f-snack-undo" id="btn-snack-undo">Отменить</button>' : ''}
      </div>
    `;
  }

  function renderSide() {
    const v = VARIANTS.find(x => x.key === state.variant);
    document.getElementById('variant-notes').innerHTML = `
      <h2>Вариант ${v.key} — ${v.name}</h2>
      <p>${v.summary}</p>
      <div style="font-size:12px;font-weight:700;color:#1e5b2e;margin-top:8px">Плюсы</div>
      <ul>${v.pros.map(x => `<li>${x}</li>`).join('')}</ul>
      <div style="font-size:12px;font-weight:700;color:#8a4b08;margin-top:8px">Компромиссы</div>
      <ul>${v.tradeoffs.map(x => `<li>${x}</li>`).join('')}</ul>
    `;

    const p = passProgress();
    const locked = isPassLocked();
    const days = getDays();
    const daySummary = days.map(d => {
      const st = state.dayStatus[d.id] || 'todo';
      const icon = st === 'done' ? '✓' : st === 'skipped' ? '⊘' : '○';
      return `${d.id}:${icon}`;
    }).join('  ');

    document.getElementById('state-panel').innerHTML = `
      <h2>Состояние прототипа (live)</h2>
      <div class="state-grid">
        <span class="state-k">Чередование</span>
        <span class="state-v">${state.alternating ? 'ON (тяжёлая ↔ лёгкая)' : 'OFF (обычный план)'}</span>

        <span class="state-k">Проход</span>
        <span class="state-v">${state.alternating ? `#${state.passNumber} · ${p.resolved}/${p.total} (вып. ${p.done}, проп. ${p.skipped})` : '—'}</span>

        <span class="state-k">Вариант недели</span>
        <span class="state-v">${state.alternating
          ? `<span class="pill-inline ${state.currentWeek === 'heavy' ? 'pill-heavy' : 'pill-light'}">${weekShort(state.currentWeek)}</span>${state.currentWeek !== state.proposedWeek ? ' (выбран вручную)' : ' (предложен)'}`
          : '—'}</span>

        <span class="state-k">Переключение</span>
        <span class="state-v">${state.alternating
          ? (locked ? '<span class="pill-inline pill-lock">Зафиксирован на проход</span>' : '<span class="pill-inline pill-open">Доступно до старта</span>')
          : '—'}</span>

        <span class="state-k">Дни прохода</span>
        <span class="state-v">${state.alternating ? daySummary : days.map(d => d.id).join('  ')}</span>

        <span class="state-k">Выбранный день</span>
        <span class="state-v">День ${state.selectedDay}</span>

        <span class="state-k">История проходов</span>
        <span class="state-v">${state.historyPasses.length ? state.historyPasses.join('; ') : 'пока нет'}</span>
      </div>
    `;

    document.getElementById('log-panel').innerHTML = `
      <h2>Журнал действий</h2>
      <ul class="log-list">${state.logs.map(l => `<li>${l}</li>`).join('')}</ul>
    `;
  }

  function render() {
    updateUrl();
    const v = VARIANTS.find(x => x.key === state.variant);
    document.getElementById('proto-label').textContent = `${v.key} (${v.name})`;

    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.preset === state.preset);
    });
    document.querySelectorAll('[data-days]').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.days) === state.dayCount);
    });

    let screenHtml = '';
    if (!state.alternating) {
      screenHtml = renderBaselineOffHome();
    } else if (state.variant === 'A') {
      screenHtml = renderVariantA();
    } else if (state.variant === 'B') {
      screenHtml = renderVariantB();
    } else {
      screenHtml = renderVariantC();
    }

    const phone = document.getElementById('phone');
    phone.innerHTML = `
      <div class="f-status">
        <span>10:42</span>
        <span>5G · 84%</span>
      </div>
      <div class="f-scroll">
        <div class="f-brand">
          <span class="f-d">Fitty</span>
          ${!state.alternating ? '<span style="font-size:11px;font-weight:500;color:var(--f-dim)">чередование выкл.</span>' : ''}
        </div>
        ${screenHtml}
      </div>
      ${renderSnack()}
      <div class="f-nav" aria-label="Нижняя навигация">
        <div class="f-nav-item active">${ICONS.home}<span>Главная</span></div>
        <div class="f-nav-item" aria-label="История">${ICONS.history}</div>
        <div class="f-nav-item" aria-label="Настройки">${ICONS.settings}</div>
      </div>
      ${renderOverlay()}
    `;

    bindPhoneEvents();
    renderSide();
  }

  function bindPhoneEvents() {
    const phone = document.getElementById('phone');

    phone.querySelectorAll('[data-select-day]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-vb-more]') || e.target.closest('[data-restore-day]')) return;
        const id = el.dataset.selectDay;
        state.selectedDay = id;
        state.vbMenuOpenFor = null;
        state.vbConfirmSkipFor = null;
        state.vcConfirmSkipFor = null;
        render();
      });
    });

    phone.querySelectorAll('[data-set-week]').forEach(el => {
      el.addEventListener('click', () => switchWeekVariant(el.dataset.setWeek));
    });

    phone.querySelectorAll('[data-restore-day]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        restoreSkippedDay(el.dataset.restoreDay);
      });
    });

    // Variant A events
    const vaLock = document.getElementById('va-locked-toggle');
    if (vaLock) vaLock.addEventListener('click', () => {
      state.lockedHintVisible = !state.lockedHintVisible;
      render();
    });
    const vaSkip = document.getElementById('va-open-skip');
    if (vaSkip) vaSkip.addEventListener('click', () => {
      state.sheet = { type: 'skip', dayId: state.selectedDay };
      render();
    });

    // Variant B events
    const vbPick = document.getElementById('vb-open-week-picker');
    if (vbPick) vbPick.addEventListener('click', () => {
      state.sheet = { type: 'pick_week' };
      render();
    });
    const vbLock = document.getElementById('vb-open-locked');
    if (vbLock) vbLock.addEventListener('click', () => {
      state.sheet = { type: 'locked_info' };
      render();
    });
    phone.querySelectorAll('[data-vb-more]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.dataset.vbMore;
        state.vbConfirmSkipFor = null;
        state.vbMenuOpenFor = state.vbMenuOpenFor === id ? null : id;
        render();
      });
    });
    const vbStep = document.getElementById('vb-step-confirm');
    if (vbStep) vbStep.addEventListener('click', () => {
      state.vbConfirmSkipFor = state.selectedDay;
      state.vbMenuOpenFor = null;
      render();
    });
    const vbDoSkip = document.getElementById('vb-do-skip');
    if (vbDoSkip) vbDoSkip.addEventListener('click', () => confirmSkipDay(state.selectedDay));
    const vbCancel = document.getElementById('vb-cancel-skip');
    if (vbCancel) vbCancel.addEventListener('click', () => {
      state.vbConfirmSkipFor = null;
      render();
    });

    // Variant C events
    const vcLock = document.getElementById('vc-locked-toggle');
    if (vcLock) vcLock.addEventListener('click', () => {
      state.lockedHintVisible = !state.lockedHintVisible;
      render();
    });
    const vcAsk = document.getElementById('vc-ask-skip');
    if (vcAsk) vcAsk.addEventListener('click', () => {
      state.vcConfirmSkipFor = state.selectedDay;
      render();
    });
    const vcDoSkip = document.getElementById('vc-do-skip');
    if (vcDoSkip) vcDoSkip.addEventListener('click', () => confirmSkipDay(state.selectedDay));
    const vcCancel = document.getElementById('vc-cancel-skip');
    if (vcCancel) vcCancel.addEventListener('click', () => {
      state.vcConfirmSkipFor = null;
      render();
    });

    // Common: start workout simulation
    const startBtn = document.getElementById('btn-start-workout');
    if (startBtn) startBtn.addEventListener('click', () => simulateWorkoutStart(state.selectedDay));

    // Sheet buttons
    const scrim = document.getElementById('sheet-scrim');
    if (scrim) scrim.addEventListener('click', (e) => {
      if (e.target === scrim) { state.sheet = null; render(); }
    });
    const sheetClose = document.getElementById('sheet-close');
    if (sheetClose) sheetClose.addEventListener('click', () => { state.sheet = null; render(); });
    const sheetConfirm = document.getElementById('sheet-confirm-skip');
    if (sheetConfirm) sheetConfirm.addEventListener('click', () => confirmSkipDay(state.sheet.dayId));

    // Banner & snackbar undo
    const snackUndo = document.getElementById('btn-snack-undo');
    if (snackUndo && state.undoSnapshot) {
      snackUndo.addEventListener('click', () => restoreSnapshot(state.undoSnapshot, 'Пропуск дня отменён (Undo).'));
    }
    const bannerUndo = document.getElementById('btn-banner-undo');
    if (bannerUndo && state.undoSnapshot) {
      bannerUndo.addEventListener('click', () => restoreSnapshot(state.undoSnapshot, 'Завершение прохода через пропуск отменено.'));
    }
    const bannerClose = document.getElementById('btn-banner-close');
    if (bannerClose) {
      bannerClose.addEventListener('click', () => { state.transitionBanner = null; render(); });
    }
  }

  function cycleVariant(dir) {
    const idx = VARIANTS.findIndex(v => v.key === state.variant);
    state.variant = VARIANTS[(idx + dir + VARIANTS.length) % VARIANTS.length].key;
    clearEphemeral();
    render();
  }

  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
  });
  document.querySelectorAll('[data-days]').forEach(btn => {
    btn.addEventListener('click', () => setDayCount(Number(btn.dataset.days)));
  });

  document.getElementById('proto-prev').addEventListener('click', () => cycleVariant(-1));
  document.getElementById('proto-next').addEventListener('click', () => cycleVariant(1));

  window.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); cycleVariant(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); cycleVariant(1); }
    if (e.key === 'Escape' && state.sheet) { state.sheet = null; render(); }
  });

  render();
})();
</script>
</body>
</html>
